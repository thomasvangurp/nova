[workspace]
name = "nova-molecules-blackwell-reference"
version = "0.1.0"
description = "Isolated offline Blackwell search/reference runtime; NIM keeps its own image runtime"
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12.8", glibc = "2.35" }]
requires-pixi = ">=0.73,<0.74"

[environments]
bz2 = { features = [], no-default-feature = false }

[dependencies]
python = "3.11.*"
ninja = "*"
pybind11 = "*"
# JIT extensions must use the reference wheel's CUDA major/minor, not the
# host's CUDA 13.2 toolkit used by the independent NIM image.
cuda-nvcc = "12.8.*"
cuda-cudart-dev = "12.8.*"

[pypi-dependencies]
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu128" }
numpy = "==1.26.4"
pandas = "==2.2.3"
rdkit = "==2024.9.4"
scikit-learn = "==1.6.1"
pytorch-lightning = "==2.5.5"
hydra-core = "==1.3.2"
dm-tree = "==0.1.8"
requests = "==2.32.3"
einops = "==0.8.0"
einx = "==0.3.0"
fairscale = "==0.4.13"
mashumaro = "==3.14"
modelcif = "==1.2"
wandb = "==0.18.7"
click = "==8.1.7"
pyyaml = "==6.0.2"
biopython = "==1.84"
scipy = "==1.13.1"
numba = "==0.61.0"
gemmi = "==0.6.5"
chembl-structure-pipeline = "==1.2.2"
types-requests = "*"
triton = "==3.3.1"
cuequivariance = "==0.6.1"
cuequivariance-torch = "==0.6.1"
cuequivariance-ops-cu12 = "==0.6.1"
cuequivariance-ops-torch-cu12 = "==0.6.1"

[tasks]
check = "python -c \"import torch; assert torch.cuda.device_count() == 8; print(torch.__version__, torch.version.cuda)\""
