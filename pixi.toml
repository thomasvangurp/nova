# Chain/miner environment, carried over unchanged from the branch that actually
# wrote commitments (deploy/nanobody-standalone). Python 3.10 is not a
# preference: the timelock wheels are cp310-only. Keep the async substrate stack
# coherent -- substrate-interface and py-scale-codec own the same scalecodec
# namespace and must not be added beside async-substrate-interface.
[feature.chain310.dependencies]
python = "3.10.*"
pip = "*"
numpy = ">=2,<2.3"
pandas = "2.2.*"
rdkit = "2024.09.*"
cryptography = ">=46"
python-dotenv = "*"
requests = "*"
pyyaml = "*"
pytest = "*"

[feature.chain310.pypi-dependencies]
bittensor = "==10.4.1"
timelock = "==0.0.1.dev0"
async-substrate-interface = "==2.0.4"
cyscale = "==0.4.0"

[feature.chain310.tasks]
check = "python -c \"import bittensor,timelock; from async_substrate_interface.sync_substrate import SubstrateInterface; print(bittensor.__version__)\""
publish-current-nanobody = "cd /root && python tools/publish_current_nanobody.py"
test-nanobody-publisher = "cd /root && python -m pytest -q tests/test_publish_current_nanobody.py"
# There is deliberately no slot-manager task here. This workspace is linux-64
# only and the slot purchase agent needs the coldkey and the macOS Keychain, so
# it runs on the operator's machine (ansible/slots.yml) and never on a rental.

[feature.metanano.tasks]
check = "python -c \"import Bio, anarci, metanano; print(Bio.__version__)\""
build-teacher-redesign-spec = "python /root/nanobody_opt/build_teacher_redesign_spec.py"
filter-layer2 = "cd /root && python -m nanobody_opt.filter_layer2"
check-validator-novelty = "cd /root && python -m nanobody_opt.check_validator_novelty"
generate-donor-grafts = "cd /root && python -m nanobody_opt.generate_donor_grafts"
backtest-mutation-ranker = "cd /root && python -m nanobody_opt.backtest_mutation_ranker"
