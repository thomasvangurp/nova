---
# The subnet-68 slot purchase agent, deployed on the OPERATOR'S OWN MACHINE.
#
# It runs here and nowhere else for one reason: burn-registering needs the
# coldkey, and the coldkey password comes out of the macOS Keychain. A coldkey on
# a rented box is an unrecoverable loss, so the box gets hotkeys only and this
# service never goes near it. ansible/nanobody.yml and ansible/nanobody_services.yml
# both assert that no coldkey is present on the rental; this playbook is the
# other half of that boundary.
#
# Nothing here reads, resolves, prints or stores the coldkey password. The only
# credential-adjacent string that appears is
# NOVA_COLDKEY_KEYCHAIN_SERVICE -- the NAME of an environment variable that in
# turn names a Keychain service. That name is passed to the agent, which shells
# out to security(1) itself and holds the value in one local variable for the
# duration of one decrypt call. There is deliberately no lookup of any kind in
# this playbook or in any vars file, and the operator's shell must export
# NOVA_COLDKEY_KEYCHAIN_SERVICE before the tmux session is created, since the
# session inherits the environment it is created in.
#
# The deployed unit is a DRY RUN. --execute-registrations is the flag that
# spends tau, and it is not passed here under any variable. Turning on live
# purchasing is a deliberate manual act by the operator in the tmux session, not
# a deployment side effect. There is intentionally no ansible variable that can
# flip it, because a variable that can flip it is a variable that will be flipped
# by a copied command line.
- name: Deploy the subnet-68 slot purchase agent on the operator's machine
  hosts: slot_manager
  # Facts are gathered here, unlike the GPU plays, because this play needs
  # ansible_env: the operator's HOME for the decision log, and the presence --
  # never the value -- of the exported Keychain service-name variable.
  gather_facts: true
  any_errors_fatal: true

  vars:
    repo: "{{ playbook_dir }}/.."
    slot_manager_session: nova-nanobody-slots
    slot_manager_activate: true
    # Interpreter with bittensor available. This workspace's Pixi manifest is
    # linux-64 only, so the GPU box's locked environment is not an option here;
    # name whatever interpreter the operator keeps bittensor in.
    # On a remote purchase host the interpreter is the one built from this
    # repository's own committed arm64 lock, inside the synced tree. It survives
    # redeploys because .pixi is excluded from the sync; putting it at the tree
    # ROOT does not survive, because the sync overwrites the manifest there with
    # the workspace root's, whose pinned pixi version the Pi does not have.
    slot_manager_python: "{{ (slot_host_workspace ~ '/.pixi/envs/default/bin/python') if ansible_system == 'Linux' else 'python3' }}"
    # Hold what we can convert, and no more. We commit every uid we hold and
    # only two to five of seven are scored -- epochs 25099, 25100 and 25101
    # scored 5, 2 and 2 -- so a further registration buys a submission that
    # probably will not appear. Raise this again when scored-per-held is close
    # to one, not before.
    slot_manager_minimum_hotkeys: 12
    # Keep twelve as the working fleet, but use a cheap thirteenth registration
    # as a one-slot churn buffer.  A clean 2026-09-22 replay put the best
    # observed threshold at tau0.175: total spend stayed essentially flat while
    # time below twelve fell 44%.  This is a cap, not a permanent target.
    slot_manager_reserve_hotkeys: 1
    slot_manager_reserve_max_recycle_tao: 0.175
    slot_manager_interval: 900
    slot_manager_wallet: mining_ops
    slot_manager_hotkey_prefix: nova68-slot
    slot_manager_netuid: 68
    slot_manager_network: finney
    slot_manager_decision_log: "{{ ansible_env.HOME }}/.nova/subnet68_slots.jsonl"
    slot_manager_max_recycle_tao: 0.20
    slot_manager_max_spend_tao_per_day: 3.4560
    slot_manager_keychain_service_env: NOVA_COLDKEY_KEYCHAIN_SERVICE
    # auto resolves to keychain on macOS and systemd on Linux, matching what the
    # host actually has; the agent makes the same choice by platform.
    slot_manager_credential_source: auto
    # systemd path only. The NAME is configuration; the encrypted blob is data.
    slot_manager_credential_name: nova-coldkey-password
    slot_manager_credential_path: /etc/nova/coldkey-password.cred
    slot_manager_service: nova-slot-manager
    slot_manager_user: "{{ ansible_user_id }}"
    slot_manager_home: "{{ ansible_env.HOME }}"
    # How often to LOOK. Buying is rate-limited inside the agent, so a frequent
    # check costs one chain read and buys nothing extra -- but it is what makes a
    # purchase cheap, because the floor test needs several samples inside its
    # lookback window to tell a decay floor from a post-spike price.
    slot_manager_check_seconds: 300
    slot_manager_lookback_blocks: 180
    # Live purchasing. Default off, and it must be passed explicitly on the
    # command line -- never set in a vars file, because a vars file gets copied
    # between hosts and a copied file is how an unattended machine starts
    # spending. The rails below stay on in both modes.
    slot_manager_execute: false
    # Where the repository lives on a remote purchase host.
    slot_manager_remote_repo: /opt/nova-nanobody
    # The purchase host's own Pixi workspace inside the synced tree. It is not
    # the tree root: the sync overwrites the root manifest with the workspace
    # root's, whose pinned pixi version the Pi does not have.
    slot_host_workspace: "{{ slot_manager_remote_repo }}/deploy/slot_host"
    # pixi is installed per-user by its own installer, so it is under the service
    # user's home rather than on PATH for a non-login ansible shell. Named here
    # so a host that keeps it elsewhere can be pointed at it without a patch.
    slot_host_pixi: "{{ slot_manager_home }}/.pixi/bin/pixi"

    # ---- Hotkey delivery ---------------------------------------------------
    # The purchaser creates hotkeys where the coldkey is; the miner needs them
    # where the GPU is. This timer is the only thing that moves them, and it ran
    # for a week as two hand-installed units that a rebuild would have dropped.
    hotkey_sync_service: nova-hotkey-sync
    hotkey_sync_script: "{{ slot_host_workspace }}/sync_hotkeys.sh"
    hotkey_sync_vastai: "{{ slot_host_workspace }}/.pixi/envs/default/bin/vastai"
    # Resolved on the controller from the same variable the dynamic inventory
    # reads, with the same default, so the unit looks for the box under the label
    # this deploy's inventory just used. Hardcoding it here would let the two
    # disagree, and the script's failure mode for "no box under that label" is a
    # successful no-op.
    hotkey_sync_vast_label: "{{ lookup('env', 'NOVA_VAST_LABEL') | default('nova-nanobody-pixi', true) }}"
    hotkey_sync_boot_seconds: 300
    hotkey_sync_interval_seconds: 600
    artifact_backup_service: nova-artifact-backup
    artifact_backup_script: "{{ slot_host_workspace }}/backup_artifacts.sh"
    artifact_backup_dir: "{{ slot_manager_home }}/nova-backups"
    # A window of snapshots, not one copy: corruption noticed late is only
    # recoverable if an older good one survives. 24 at 30 minutes is 12 hours.
    artifact_backup_keep: 24
    artifact_backup_boot_seconds: 420
    # Shorter than one 72-minute epoch, so at most one epoch of exact screens
    # is ever at risk.
    artifact_backup_interval_seconds: 1800
    # Locators only: the paths the vastai client itself reads its API key from.
    # This playbook stats them and never opens them.
    hotkey_sync_api_key_paths:
      - "{{ slot_manager_home }}/.config/vastai/vast_api_key"
      - "{{ slot_manager_home }}/.vast_api_key"

  tasks:
    - name: Require committed source for the deployed agent
      ansible.builtin.command:
        argv: [git, -C, "{{ repo }}", status, --porcelain, --untracked-files=all]
      register: controller_status
      changed_when: false
      failed_when: controller_status.stdout | length > 0

    - name: Create the decision log directory
      ansible.builtin.file:
        path: "{{ slot_manager_decision_log | dirname }}"
        state: directory
        mode: "0700"

    - name: Name the agent's launcher and arguments once
      ansible.builtin.set_fact:
        # --execute-registrations is absent by design; see the header.
        slot_manager_launcher:
          - "{{ slot_manager_python }}"
          - -m
          - nanobody_opt.slot_manager
        slot_manager_arguments:
          - --netuid
          - "{{ slot_manager_netuid }}"
          - --network
          - "{{ slot_manager_network }}"
          - --wallet
          - "{{ slot_manager_wallet }}"
          - --hotkey-prefix
          - "{{ slot_manager_hotkey_prefix }}"
          - --minimum-hotkeys
          - "{{ slot_manager_minimum_hotkeys }}"
          - --reserve-hotkeys
          - "{{ slot_manager_reserve_hotkeys }}"
          - --reserve-max-recycle-tao
          - "{{ slot_manager_reserve_max_recycle_tao }}"
          - --decision-log
          - "{{ slot_manager_decision_log }}"
          - --max-recycle-tao
          - "{{ slot_manager_max_recycle_tao }}"
          - --max-spend-tao-per-day
          - "{{ slot_manager_max_spend_tao_per_day }}"
          - --keychain-service-env
          - "{{ slot_manager_keychain_service_env }}"
          - --credential-source
          - "{{ slot_manager_credential_source }}"
          - --lookback-blocks
          - "{{ slot_manager_lookback_blocks }}"
          - --auto-convert-alpha
          - --convert-target-tao
          - "1.0"
          - --convert-slippage
          - "0.005"
          - --max-convert-alpha-per-day
          - "250"
          - --interval
          # Linux is timer-driven, so each run evaluates once and exits; the
          # decision log carries the price history between runs. macOS keeps the
          # resident tmux loop.
          - "{{ 0 if ansible_system == 'Linux' else slot_manager_interval }}"
        # Kept separate from the base list so the deploy can report which mode it
        # ran in, and so the spending flag can never arrive by accident.
        slot_manager_spend_arguments: "{{ ['--execute-registrations'] if slot_manager_execute | bool else [] }}"

    # ---- Safety gate -------------------------------------------------------
    # Same gate as the GPU services, and it works here for the same reason the
    # agent is testable without an account: everything above its argparse call
    # is standard library, so --help runs with bittensor absent, no wallet
    # loaded, no Keychain read and no chain connection.
    - name: Sync the committed source to the purchase host (Linux)
      when: ansible_system == 'Linux'
      ansible.posix.synchronize:
        src: "{{ repo }}/"
        dest: "{{ slot_manager_remote_repo }}/"
        delete: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=__pycache__"
          - "--exclude=.pixi"
          - "--exclude=snapshots"
          - "--exclude=external_tools"

    # ---- The interpreter, from the committed lock ---------------------------
    # Until now the environment every task below runs was built by hand on the
    # host -- the same gap as the two hand-installed sync units: nothing in the
    # repository could rebuild it, so a reprovisioned Pi came back with a
    # purchaser that could not import bittensor and a deploy that only told you
    # so after it had already armed the timer. Building it here, before the
    # --help probe and the import gate, is what makes those two checks mean
    # something on a host that has never run this play.
    #
    # pixi runs as the connecting user, never with become: .pixi belongs to the
    # service user, and a root-owned environment is one the unit cannot write to
    # or rebuild.
    - name: Require pixi on the purchase host (Linux)
      when: ansible_system == 'Linux'
      ansible.builtin.stat:
        path: "{{ slot_host_pixi }}"
      register: slot_host_pixi_stat

    - name: Explain how to install pixi if it is absent (Linux)
      when: ansible_system == 'Linux'
      ansible.builtin.assert:
        that: slot_host_pixi_stat.stat.exists and slot_host_pixi_stat.stat.xusr
        fail_msg: >-
          {{ slot_host_pixi }} is missing or not executable. The purchase host's
          interpreter is built from {{ slot_host_workspace }}/pixi.lock, so
          install pixi there first (`curl -fsSL https://pixi.sh/install.sh | sh`
          as {{ slot_manager_user }}) or point slot_host_pixi at the one this
          host already has. Nothing here can bootstrap it silently.
        success_msg: "pixi present at {{ slot_host_pixi }}"

    # --locked, never a bare `pixi install`. A bare install resolves whatever is
    # newest and writes a new lock on the host, which is exactly how the
    # committed lock came to describe an environment the Pi did not have: the
    # manifest declared vastai, the lock never mentioned it, and the purchaser
    # ran a hand-installed vastai that no rebuild could reproduce. With --locked a
    # lock that no longer matches this manifest fails the deploy here instead of
    # quietly resolving something new onto a live spending host.
    - name: Build the purchase host's environment from the committed lock (Linux)
      when: ansible_system == 'Linux'
      ansible.builtin.command:
        argv: ["{{ slot_host_pixi }}", install, --locked]
        chdir: "{{ slot_host_workspace }}"
      environment:
        PIXI_COLOR: never
      register: slot_host_install
      # Same idiom as the GPU box's locked environments in ansible/nanobody.yml.
      changed_when: "'Nothing to do' not in (slot_host_install.stdout ~ slot_host_install.stderr)"
      # A bare failure here is `pixi install --locked` rc=1 with one line of
      # context; the assert below says what to do about it instead.
      failed_when: false

    - name: Require the locked environment to have been installable (Linux)
      when: ansible_system == 'Linux'
      ansible.builtin.assert:
        that: slot_host_install.rc == 0
        fail_msg: >-
          `pixi install --locked` failed in {{ slot_host_workspace }}
          ({{ (slot_host_install.stderr | default('')) | regex_replace('\s+', ' ')
              | truncate(200, true) | default('see stderr', true) }}).
          If it says the lock file is not up to date, the lock and
          deploy/slot_host/pixi.toml have diverged: re-lock ON this host
          (`{{ slot_host_pixi }} lock` in {{ slot_host_workspace }}), commit the
          result, and re-run. Do not re-lock from the macOS controller -- that
          manifest is linux-aarch64 only and cannot be cross-resolved.
        success_msg: "Locked environment installed in {{ slot_host_workspace }}"

    - name: Verify the agent accepts every argument it is deployed with
      ansible.builtin.include_tasks: tasks/verify_entrypoint.yml
      vars:
        entrypoint_name: slot_manager
        entrypoint_argv: "{{ slot_manager_launcher }}"
        entrypoint_flags: "{{ slot_manager_arguments | select('match', '^--') | list }}"
        # The probe runs ON the target, so it must chdir to the repository as it
        # exists there -- the controller's path does not exist on a remote
        # purchase host, and pointing at it fails before the check can run.
        entrypoint_chdir: "{{ slot_manager_remote_repo if ansible_system == 'Linux' else repo }}"

    # The base argument list must never contain the spending flag. Enabling live
    # purchase adds it separately and visibly, so a reader can always tell which
    # mode a run deployed from the recap.
    - name: Refuse a base argument list that can spend
      ansible.builtin.assert:
        that:
          - "'--execute-registrations' not in slot_manager_arguments"
          - "'--execute' not in slot_manager_arguments"
        fail_msg: >-
          --execute-registrations must come from slot_manager_execute, not from
          the base arguments, or the deploy cannot report which mode it ran in.

    - name: State plainly which mode is being deployed
      ansible.builtin.debug:
        msg: >-
          {{ 'LIVE: this agent will SPEND up to ' ~ slot_manager_max_spend_tao_per_day
             ~ ' TAO/day, refusing any recycle above ' ~ slot_manager_max_recycle_tao
             ~ ' TAO, at most one registration per 360-block interval, until it holds '
             ~ slot_manager_minimum_hotkeys ~ ' hotkeys.'
             if slot_manager_execute | bool
             else 'DRY RUN: decisions are logged, nothing is bought. Pass
                   -e slot_manager_execute=true to spend.' }}

    # On BOTH platforms, and on Linux especially. verify_entrypoint above proves
    # only that --help runs, and --help deliberately runs with bittensor absent:
    # everything above the agent's argparse call is standard library. So on the
    # purchase host this was the one thing nothing checked -- the Linux branch
    # skipped it, armed the timer, and left a broken chain stack to be discovered
    # as an identical journal line every five minutes. deploy/slot_host/pixi.toml
    # declares this exact import as its `check` task for this reason.
    - name: Require the chain stack the agent needs for its reads
      ansible.builtin.command:
        argv:
          - "{{ slot_manager_python }}"
          - -c
          - >-
            import bittensor;
            from async_substrate_interface.sync_substrate import SubstrateInterface;
            print('SLOT_MANAGER_BITTENSOR_OK', bittensor.__version__)
      changed_when: false
      failed_when: false
      register: slot_manager_bittensor
      when: slot_manager_activate | bool

    - name: Report whether chain reads will work
      ansible.builtin.assert:
        that: "'SLOT_MANAGER_BITTENSOR_OK' in slot_manager_bittensor.stdout"
        fail_msg: >-
          {{ slot_manager_python }} cannot import the chain stack
          ({{ (slot_manager_bittensor.stderr | default(''))
              | regex_search('(ModuleNotFoundError|ImportError|No such file)[^\n]*')
              | default('see stderr', true) }}).
          The decision core runs without it, but chain reads and registration
          cannot, so the agent would exit on its first poll. On the purchase host
          rebuild it there with `pixi install` in deploy/slot_host; elsewhere
          point slot_manager_python at an interpreter that has it.
        success_msg: "{{ slot_manager_bittensor.stdout | trim }}"
      when: slot_manager_activate | bool

    # The session inherits the environment it is created in, which is how the
    # Keychain service NAME reaches the agent without ever being written down
    # here. Fail before the restart rather than after it.
    - name: Require the Keychain service name to be exported for the session
      when: slot_manager_activate | bool and ansible_system == 'Darwin'
      ansible.builtin.assert:
        that:
          - (ansible_env[slot_manager_keychain_service_env] | default('')) | length > 0
        fail_msg: >-
          {{ slot_manager_keychain_service_env }} is not exported in this shell.
          Export it (its VALUE is the Keychain service name, which this playbook
          never sees) and re-run, or the agent will exit the first time it needs
          to unlock the coldkey.
        success_msg: >-
          {{ slot_manager_keychain_service_env }} is exported; its value was not
          read.

    - name: Restart the slot purchase agent on committed source (macOS, tmux)
      ansible.builtin.command:
        argv: [tmux, kill-session, -t, "{{ slot_manager_session }}"]
      register: slot_manager_stop
      changed_when: slot_manager_stop.rc == 0
      failed_when: false
      when: slot_manager_activate | bool and ansible_system == 'Darwin'

    # Named for what it does rather than for one of the two modes it can start:
    # slot_manager_spend_arguments is appended below, so this task launched a
    # live spender under a task name that said "dry run".
    - name: Start the slot purchase agent in the deployed mode (macOS, tmux)
      ansible.builtin.command:
        argv: >-
          {{ ['tmux', 'new-session', '-d', '-s', slot_manager_session]
             + slot_manager_launcher + slot_manager_arguments
             + slot_manager_spend_arguments }}
      args:
        chdir: "{{ repo }}"   # macOS runs from the controller's own checkout
      changed_when: true
      when: slot_manager_activate | bool and ansible_system == 'Darwin'

    - name: Confirm the slot purchase agent remains alive (macOS, tmux)
      ansible.builtin.command:
        argv: [tmux, has-session, -t, "{{ slot_manager_session }}"]
      changed_when: false
      when: slot_manager_activate | bool and ansible_system == 'Darwin'

    # ---- Linux: a real service, because a Pi reboots and tmux does not survive
    # one. The purchaser has to be awake for the quiet registration intervals or
    # it buys at the top of the decay curve, so "starts itself again" is a
    # correctness property here, not tidiness.
    # Only the credential directory. The decision log lives in the service user's
    # home and is created unprivileged above; creating it as root here would give
    # a 0700 root-owned directory to a unit that runs as {{ slot_manager_user }},
    # and the agent's first append would fail on Permission denied -- silently,
    # because a decision log that cannot be written is also the price history the
    # floor test reads, so the agent would simply stop finding a floor and stop
    # buying. It only worked because an earlier task happened to create it first;
    # that ordering is not something a later edit should be able to break.
    - name: Create the root-owned credential directory (Linux)
      become: true
      when: ansible_system == 'Linux'
      ansible.builtin.file:
        path: "{{ slot_manager_credential_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # Refuse to install a unit whose credential does not exist yet: systemd would
    # start, fail to decrypt, and Restart=always would retry forever while the
    # journal filled with the same line. Better to say so here.
    - name: Require the encrypted coldkey credential to exist (Linux)
      become: true
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.stat:
        path: "{{ slot_manager_credential_path }}"
      register: slot_manager_credential

    - name: Explain how to create the credential if it is absent (Linux)
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.assert:
        that: slot_manager_credential.stat.exists
        fail_msg: >-
          {{ slot_manager_credential_path }} does not exist. systemd-creds
          encryption is host-bound, so it must be created ON this host and cannot
          be shipped from the controller. As root there:
          systemd-ask-password -n |
          systemd-creds encrypt --name={{ slot_manager_credential_name }} -
          {{ slot_manager_credential_path }}
        success_msg: "Encrypted coldkey credential present; its value was not read."

    - name: Install the slot purchase unit (Linux)
      become: true
      when: ansible_system == 'Linux'
      ansible.builtin.template:
        src: templates/nova-slot-manager.service.j2
        dest: "/etc/systemd/system/{{ slot_manager_service }}.service"
        mode: "0644"
      vars:
        slot_manager_repo: "{{ slot_manager_remote_repo }}"
        slot_manager_exec: >-
          {{ (slot_manager_launcher + slot_manager_arguments
              + slot_manager_spend_arguments) | join(' ') }}
      register: slot_manager_unit

    - name: Remove the legacy ExecStart-replacing conversion drop-in (Linux)
      become: true
      when: ansible_system == 'Linux'
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ slot_manager_service }}.service.d/auto-convert.conf"
        state: absent


    - name: Install the slot purchase timer (Linux)
      become: true
      when: ansible_system == 'Linux'
      ansible.builtin.template:
        src: templates/nova-slot-manager.timer.j2
        dest: "/etc/systemd/system/{{ slot_manager_service }}.timer"
        mode: "0644"
      register: slot_manager_timer

    # The TIMER is enabled, never the service: enabling a oneshot service would
    # run one check at boot and then nothing.
    - name: Schedule the slot purchase checks (Linux)
      become: true
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.systemd_service:
        name: "{{ slot_manager_service }}.timer"
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Confirm the schedule is armed and has a next run (Linux)
      become: true
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - "{{ slot_manager_service }}.timer"
          - --property=ActiveState
          - --property=UnitFileState
          - --property=NextElapseUSecMonotonic
      register: slot_manager_schedule
      changed_when: false
      # This used to read NextElapseUSecRealtime and require the string
      # "NextElapseUSecRealtime=" to be present -- which systemd always prints,
      # EMPTY, for a monotonic timer like this one. The task therefore reported
      # "has a next run" for every possible state of the timer, including none.
      # The monotonic property carries the real answer: a timespan when a run is
      # scheduled, the literal "infinity" when the timer is active but will never
      # fire again.
      failed_when: >-
        'ActiveState=active' not in slot_manager_schedule.stdout
        or 'UnitFileState=enabled' not in slot_manager_schedule.stdout
        or slot_manager_schedule.stdout is search('NextElapseUSecMonotonic=(infinity|0)?(\n|$)')

    # Prove the check itself runs to completion under the unit, rather than
    # trusting that a timer which is armed will fire something that works.
    - name: Run one scheduled check now (Linux)
      become: true
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.command:
        argv: [systemctl, start, "--wait", "{{ slot_manager_service }}.service"]
      changed_when: true

    # ---- Hotkey delivery: the other half of a purchase (Linux) -------------
    # A bought slot that never reaches the box is indistinguishable from a slot
    # that was never bought -- same empty leaderboard row, same "no submission
    # for this uid". The delivery half ran for a week as two units installed by
    # hand on the Pi, which means it existed only until the next rebuild. It is
    # rendered here now, on the Linux path only: the macOS path runs the
    # purchaser in tmux and has no systemd to install a timer into, and an
    # operator's laptop is not where hotkeys are bought anyway.
    - name: Require the hotkey sync script in the synced tree (Linux)
      when: ansible_system == 'Linux'
      ansible.builtin.stat:
        path: "{{ hotkey_sync_script }}"
        get_checksum: false
      register: hotkey_sync_script_stat

    - name: Explain a missing or non-executable sync script (Linux)
      when: ansible_system == 'Linux'
      ansible.builtin.assert:
        that:
          - hotkey_sync_script_stat.stat.exists
          - hotkey_sync_script_stat.stat.xusr
        fail_msg: >-
          {{ hotkey_sync_script }} is missing or not executable. The sync task
          above rsyncs it from the controller preserving mode, so this means the
          file left the repository or lost its 0755 mode in git; systemd would
          take the unit as installed and fail every tick on Permission denied.
        success_msg: "{{ hotkey_sync_script }} is present and executable."

    # Locators only. The client reads the key itself; nothing here opens the file
    # (get_checksum is off so not even its bytes are hashed), and its value never
    # enters a unit, a command line or this play's output.
    - name: Locate the vast.ai API key the sync unit needs (Linux)
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop: "{{ hotkey_sync_api_key_paths }}"
      register: hotkey_sync_api_key
      changed_when: false

    - name: Require an API key for the sync unit's user (Linux)
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.assert:
        that:
          - hotkey_sync_api_key.results | selectattr('stat.exists') | list | length > 0
        fail_msg: >-
          None of {{ hotkey_sync_api_key_paths | join(', ') }} exists, so the
          vastai client has no key when it runs as {{ slot_manager_user }} with
          HOME={{ slot_manager_home }} -- and an unauthenticated `show instances`
          fails into the same silent no-op as a missing client. Create it as
          {{ slot_manager_user }} with `vastai set api-key <key>`, mode 0600.
          Its value is never read here.
        success_msg: "An API key file exists for {{ slot_manager_user }}; it was not read."

    # The script's discovery step is
    #   "$VASTAI" show instances --raw 2>/dev/null | python3 ... || true
    # so a client that cannot answer is not an error there: the pipeline yields an
    # empty host, the script reports "no running instance labelled ..." and exits
    # 0. That is also exactly what a genuinely un-rented box looks like, so the
    # journal cannot tell the two apart -- and neither can the proving run below,
    # which is how an earlier version of this gate let a deploy pass with the
    # client pointed at the wrong file entirely.
    #
    # So ask the client the same question the unit will ask, as the same user, and
    # require an answer that PARSES. Missing binary, wrong binary, unreadable or
    # rejected API key all fail here; "no box rented right now" returns [] and
    # passes, because that is a healthy state of a purchase host and must never
    # fail a deploy. `vastai --version` is not enough: /bin/true answers that.
    #
    # Only counts come back. The raw payload (instance ids, ssh hosts and ports)
    # stays on the host, and the API key is never named, read or passed here --
    # the client resolves it itself from the file stat'ed above.
    - name: Ask the vastai client the same question the unit will (Linux)
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.shell:
        cmd: >-
          "{{ hotkey_sync_vastai }}" show instances --raw 2>/dev/null
          | python3 -c 'import json, os, sys;
          d = json.load(sys.stdin);
          m = [i for i in d if i.get("label") == os.environ["NOVA_VAST_LABEL"]];
          r = [i for i in m if i.get("actual_status") == "running"];
          print("VASTAI_RAW_OK", len(d), len(m), len(r))'
      environment:
        NOVA_VAST_LABEL: "{{ hotkey_sync_vast_label }}"
      register: hotkey_sync_instances
      changed_when: false
      failed_when: false

    - name: Require a vastai client that can answer (Linux)
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.assert:
        that:
          - hotkey_sync_instances.stdout is search('VASTAI_RAW_OK')
        fail_msg: >-
          {{ hotkey_sync_vastai }} did not return parseable instance JSON for
          {{ slot_manager_user }}
          ({{ (hotkey_sync_instances.stderr | default('')) | regex_replace('\s+', ' ')
              | truncate(160, true) | default('no output', true) }}).
          Either it is not the vastai client (the unit's NOVA_VASTAI points at
          {{ hotkey_sync_vastai }}, built by the locked environment above), or the
          API key at one of {{ hotkey_sync_api_key_paths | join(', ') }} is not
          accepted. The sync script swallows exactly this failure, so left
          unchecked every tick would report "no running instance labelled
          {{ hotkey_sync_vast_label }}" and exit 0 -- indistinguishable from an
          un-rented box, and an eternal, healthy-looking no-op.
        # Padded before indexing. Ansible renders success_msg even when the
        # assertion FAILS, so an unguarded stdout.split()[1] turns every failure
        # of this gate into "object of type 'list' has no attribute 1" and the
        # explanation above is never printed.
        success_msg: >-
          vastai answered for {{ slot_manager_user }}:
          {{ (hotkey_sync_instances.stdout.split() + ['?', '?', '?', '?'])[1] }} instance(s),
          {{ (hotkey_sync_instances.stdout.split() + ['?', '?', '?', '?'])[2] }} labelled
          {{ hotkey_sync_vast_label }},
          {{ (hotkey_sync_instances.stdout.split() + ['?', '?', '?', '?'])[3] }} running.

    - name: Install the hotkey sync unit (Linux)
      become: true
      when: ansible_system == 'Linux'
      ansible.builtin.template:
        src: templates/nova-hotkey-sync.service.j2
        dest: "/etc/systemd/system/{{ hotkey_sync_service }}.service"
        owner: root
        group: root
        mode: "0644"
      register: hotkey_sync_unit

    - name: Install the hotkey sync timer (Linux)
      become: true
      when: ansible_system == 'Linux'
      ansible.builtin.template:
        src: templates/nova-hotkey-sync.timer.j2
        dest: "/etc/systemd/system/{{ hotkey_sync_service }}.timer"
        owner: root
        group: root
        mode: "0644"
      register: hotkey_sync_timer_unit

    # The TIMER is enabled, never the service: enabling a oneshot service would
    # push once at boot and then never again.
    - name: Schedule the hotkey sync (Linux)
      become: true
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.systemd_service:
        name: "{{ hotkey_sync_service }}.timer"
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Require the artifact backup script in the synced tree (Linux)
      when: ansible_system == 'Linux'
      ansible.builtin.stat:
        path: "{{ artifact_backup_script }}"
      register: artifact_backup_script_stat

    - name: Refuse to schedule a backup with no script to run (Linux)
      when: ansible_system == 'Linux'
      ansible.builtin.assert:
        that: artifact_backup_script_stat.stat.exists
        fail_msg: >-
          {{ artifact_backup_script }} is missing. A timer pointing at nothing
          reports active and backs nothing up, which is the failure it exists to
          prevent.

    - name: Create the backup directory (Linux)
      when: ansible_system == 'Linux'
      ansible.builtin.file:
        path: "{{ artifact_backup_dir }}"
        state: directory
        owner: "{{ slot_manager_user }}"
        group: "{{ slot_manager_user }}"
        mode: "0750"

    - name: Install the artifact backup unit (Linux)
      become: true
      when: ansible_system == 'Linux'
      ansible.builtin.template:
        src: templates/nova-artifact-backup.service.j2
        dest: "/etc/systemd/system/{{ artifact_backup_service }}.service"
        owner: root
        group: root
        mode: "0644"

    - name: Install the artifact backup timer (Linux)
      become: true
      when: ansible_system == 'Linux'
      ansible.builtin.template:
        src: templates/nova-artifact-backup.timer.j2
        dest: "/etc/systemd/system/{{ artifact_backup_service }}.timer"
        owner: root
        group: root
        mode: "0644"

    - name: Schedule the artifact backup (Linux)
      become: true
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.systemd_service:
        name: "{{ artifact_backup_service }}.timer"
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Confirm the backup schedule is armed and has a next run (Linux)
      become: true
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - "{{ artifact_backup_service }}.timer"
          - --property=ActiveState
          - --property=UnitFileState
          - --property=NextElapseUSecMonotonic
      register: artifact_backup_schedule
      changed_when: false
      failed_when: >-
        'ActiveState=active' not in artifact_backup_schedule.stdout
        or 'UnitFileState=enabled' not in artifact_backup_schedule.stdout
        or artifact_backup_schedule.stdout is search('NextElapseUSecMonotonic=(infinity|0)?(\n|$)')

    - name: Confirm the sync schedule is armed and has a next run (Linux)
      become: true
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - "{{ hotkey_sync_service }}.timer"
          - --property=ActiveState
          - --property=UnitFileState
          - --property=NextElapseUSecMonotonic
      register: hotkey_sync_schedule
      changed_when: false
      # Monotonic, not Realtime: these are OnBootSec/OnUnitActiveSec timers, so
      # systemd leaves NextElapseUSecRealtime EMPTY and a check for the string
      # "NextElapseUSecRealtime=" passes on a timer with no next run at all. The
      # monotonic value is a timespan when a run is scheduled and the literal
      # "infinity" when none is, which is a state an active timer can reach.
      failed_when: >-
        'ActiveState=active' not in hotkey_sync_schedule.stdout
        or 'UnitFileState=enabled' not in hotkey_sync_schedule.stdout
        or hotkey_sync_schedule.stdout is search('NextElapseUSecMonotonic=(infinity|0)?(\n|$)')

    # An armed timer is not a working one. This unit's whole failure mode is
    # running and achieving nothing, so the deploy runs it once, under its own
    # User=, HOME= and WorkingDirectory=, and reads back what that run said.
    - name: Note when the proving run starts (Linux)
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.command:
        argv: [date, +%s]
      register: hotkey_sync_started
      changed_when: false

    - name: Run one hotkey sync now (Linux)
      become: true
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.command:
        argv: [systemctl, start, "--wait", "{{ hotkey_sync_service }}.service"]
      changed_when: true

    - name: Read back what that run reported (Linux)
      become: true
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - "{{ hotkey_sync_service }}.service"
          - "--since"
          - "@{{ hotkey_sync_started.stdout | trim }}"
          - "--no-pager"
          - -o
          - cat
      register: hotkey_sync_journal
      changed_when: false

    # All four of the script's outcomes are accepted, because three of them are
    # healthy states of a live fleet: no wallet hotkey directory yet, no hotkey
    # matching the prefix yet, and no box rented right now. Requiring a sync to
    # have happened would fail every deploy made while no GPU is rented -- which
    # is most of them, since the purchaser exists precisely to keep buying when
    # no box is up. What is required is evidence that THIS unit reached one of
    # them, rather than a timer pointing at something that no longer runs.
    - name: Require that run to have reached one of the script's outcomes (Linux)
      when: slot_manager_activate | bool and ansible_system == 'Linux'
      ansible.builtin.assert:
        that:
          - hotkey_sync_journal.stdout is search('no hotkey directory at|no hotkeys matching|no running instance labelled|box now holds')
        fail_msg: >-
          {{ hotkey_sync_service }}.service exited 0 without reporting any of the
          outcomes {{ hotkey_sync_script | basename }} can reach
          ({{ hotkey_sync_journal.stdout | regex_replace('\s+', ' ')
              | truncate(200, true) | default('no journal output', true) }}).
          The unit ran something else, or its output is not reaching the journal,
          so the one thing this timer exists to prove is unproven.
        # default(..., true) because regex_search returns None when nothing
        # matches, and Ansible renders success_msg even for a FAILING assert: a
        # None here is rejected as "not str_or_list_of_str" and the explanation
        # above is replaced by that type error, exactly when it is needed.
        success_msg: >-
          {{ hotkey_sync_journal.stdout
             | regex_search('no hotkey directory at[^\n]*|no hotkeys matching[^\n]*|no running instance labelled[^\n]*|synced [^\n]*')
             | default('no outcome reported', true) }}

    - name: Count what crossed and what the box holds (Linux)
      when:
        - slot_manager_activate | bool
        - ansible_system == 'Linux'
        - hotkey_sync_journal.stdout is search('box now holds')
      ansible.builtin.set_fact:
        hotkey_sync_sent: "{{ hotkey_sync_journal.stdout | regex_search('synced [0-9]+ local') | regex_search('[0-9]+') }}"
        hotkey_sync_present: "{{ hotkey_sync_journal.stdout | regex_search('box now holds [0-9]+') | regex_search('[0-9]+') }}"

    # Only when a box is rented, and only one-directional: the box may legitimately
    # hold more than crossed this run (keys from an earlier wallet generation are
    # not deleted), but it must never hold FEWER than what was just pushed -- that
    # is the drift this unit exists to end, and rsync reporting success while the
    # box comes back short means the push is landing somewhere the miner does not
    # read from.
    - name: Require the box to hold at least what was pushed (Linux)
      when:
        - slot_manager_activate | bool
        - ansible_system == 'Linux'
        - hotkey_sync_present is defined
      ansible.builtin.assert:
        that:
          - hotkey_sync_present | int >= hotkey_sync_sent | int
          - hotkey_sync_sent | int > 0
        fail_msg: >-
          {{ hotkey_sync_sent }} hotkey file(s) were pushed but the box reports
          {{ hotkey_sync_present }} matching {{ slot_manager_hotkey_prefix }}.
          The miner reads them from its own wallet directory, so a short box is a
          publisher preparing submissions for uids whose keys are not there --
          invisible from the leaderboard. Check the remote wallet path and the
          prefix both ends use.
        success_msg: >-
          Box holds {{ hotkey_sync_present }} key file(s) matching
          {{ slot_manager_hotkey_prefix }}, at least the {{ hotkey_sync_sent }} just pushed.

    - name: Report the hotkey delivery half (Linux)
      when: ansible_system == 'Linux'
      ansible.builtin.debug:
        msg: >-
          {{ hotkey_sync_service }}.timer delivers {{ slot_manager_hotkey_prefix }}*
          from {{ slot_manager_wallet }} to the box labelled
          {{ hotkey_sync_vast_label }} every
          {{ (hotkey_sync_interval_seconds / 60) | round | int }} minutes; last run said:
          {{ hotkey_sync_journal.stdout | regex_replace('\s+', ' ') | truncate(160, true) }}

    - name: Report the slot agent
      ansible.builtin.debug:
        msg: >-
          {{ slot_manager_service if ansible_system == 'Linux' else slot_manager_session }}
          holding >= {{ slot_manager_minimum_hotkeys }} registrations, checking every
          {{ slot_manager_check_seconds if ansible_system == 'Linux' else slot_manager_interval }}s, {{ 'LIVE' if slot_manager_execute | bool else 'DRY RUN' }}
          (-e slot_manager_execute=true to spend);
          decisions appended to {{ slot_manager_decision_log }}
