---
# The single definition of what lands on the GPU box and where.
#
# There is exactly ONE runtime root, ``/root``, and it is a checkout-shaped
# layout: ``/root/nanobody_opt``, ``/root/tools``, ``/root/config``,
# ``/root/compound_miner``, ``/root/utils``, ``/root/neurons``,
# ``/root/pixi.toml``. Everything that runs on the box runs from it.
#
# That is not cosmetic. Until 2026-09-12 the producer ran from ``/root`` while
# the chain publisher ran from a SECOND full copy at ``/root/nova-standalone``,
# deployed from a different branch and carrying its own Pixi workspace.
# Publication gates were relaxed in ``/root/nanobody_opt`` and nothing changed
# for hours, because the program that publishes was reading the other copy. Two
# roots cost real epochs; this file exists so there can only be one.
#
# ``config/`` is synced with the two live validator YAML documents excluded.
# ``config/config_loader.py`` loads ``config/config.yaml`` **relative to the
# process working directory**, so on the box that path is the file Ansible
# downloads from metanova-labs/nova, and the committed copy in this repository
# must never overwrite it. Excluding them here makes sync order irrelevant
# rather than load-bearing.
#
# Requires: repo

- name: Verify and stage the tested release
  ansible.builtin.include_tasks: prepare_tested_release.yml

- name: Install the verified runtime packages including the shipping v2 tree
  ansible.builtin.command:
    argv: "{{ ['rsync', '-a', '--checksum', '--exclude=__pycache__', '--exclude=*.pyc'] + (item.excludes | default([])) + [sn68_release_root ~ '/' ~ item.name ~ '/', '/root/' ~ item.name ~ '/'] }}"
  loop:
    - {name: nanobody_opt}
    - {name: nanobody_opt_v2}
    - {name: tools}
    - {name: neurons}
    - {name: compound_miner}
    - {name: utils}
    - name: config
      excludes: ['--exclude=config.yaml', '--exclude=boltzgen_config.yaml']
    - {name: tests}
    - {name: scripts}
    - {name: deploy}
    - {name: NOVA-nanobody-filter}
    - {name: data}
  loop_control:
    label: "{{ item.name }}"
  changed_when: true

- name: Install the verified deployment gate
  ansible.builtin.copy:
    src: "{{ sn68_release_root }}/deploy_gate.sh"
    dest: /root/deploy_gate.sh
    remote_src: true
    mode: "0755"

- name: Make combinatorial_db importable without shipping the molecule database
  ansible.builtin.file:
    path: /root/combinatorial_db
    state: directory
    owner: root
    group: root
    mode: "0755"

# miner.py imports combinatorial_db.reactions unconditionally, including on the
# nanobody-only path. The .sqlite it would query is a compound-miner artifact
# and is deliberately absent; the module is what makes the import succeed.
- name: Ship only the importable half of combinatorial_db
  ansible.builtin.copy:
    src: "{{ repo }}/combinatorial_db/reactions.py"
    dest: /root/combinatorial_db/reactions.py
    owner: root
    group: root
    mode: "0644"

# The repository has no committed __init__.py here, so the package marker is
# created on the box. modification_time: preserve keeps a second run from
# reporting changed forever, which would make real drift unreadable.
- name: Mark combinatorial_db as a package
  ansible.builtin.file:
    path: /root/combinatorial_db/__init__.py
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
