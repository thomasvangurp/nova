---
- name: Inspect release stamp and runtime entrypoints independently
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /root/build_stamp.json
    - /root/nanobody_opt_v2/run_live_producer.py
    - /root/nanobody_opt/run_live_producer.py
    - /root/tools/publish_current_nanobody.py
    - /root/artifacts/producer_argv.txt
  register: sn68_existing_runtime
  changed_when: false
- name: Refuse legacy provisioning over a live release
  ansible.builtin.assert:
    that:
      - sn68_existing_runtime.results | selectattr('stat.exists') | list | length == 0
    fail_msg: Existing runtimes, including unstamped ones, require a verified baseline and qualified promotion evidence.
