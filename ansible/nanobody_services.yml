---
# The chain side of the nanobody miner: the epoch publisher, and optionally the
# on-chain commitment writer.
#
# This is the merge of ansible/nanobody_standalone.yml from
# deploy/nanobody-standalone into this branch, and four things about that
# playbook were deliberately NOT carried over.
#
# 1. Its own runtime root. It rsynced the whole repository into
#    /root/nova-standalone and built a SECOND Pixi workspace there. That is the
#    split that cost epochs: publication gates were relaxed under
#    /root/nanobody_opt and nothing changed, because the publisher was reading
#    the other copy. Everything now runs from /root; the old root is deleted,
#    not ignored.
# 2. A hand-passed SSH endpoint. Its first play existed only to turn
#    -e nanobody_host/-e nanobody_port into an inventory entry. vast.ai rotates
#    the port on every restart, so that play encoded a value that goes stale on
#    its own. The endpoint now comes from the label.
# 3. One configured hotkey. It hardcoded standalone_hotkey_name and asserted a
#    single expected ss58. We hold many uids and a configured hotkey list goes
#    stale exactly the way the remembered uid did -- we published into a slot
#    somebody else owned for twenty-one days because code trusted configuration
#    over the chain. The publisher discovers the fleet from the metagraph by
#    coldkey; this playbook deploys N hotkey keyfiles and asserts nothing about
#    which uids they hold.
# 4. The Compound credential source and cutover. The compound master is gone and
#    the shared-hotkey dual-writer interlock it enforced no longer has two
#    writers to interlock. What IS kept from it is the coldkey refusal, which
#    applies to every rental in every mode.
#
# Kept from it verbatim in intent: deploy only committed source, compile before
# starting, run the focused tests on the box against the deployed tree, remove
# the unusable systemd units the Vast container leaves behind, and keep the
# chain writer stopped by default.
- ansible.builtin.import_playbook: require_producer.yml

- name: Deploy the nanobody chain publisher and commitment writer
  hosts: nanobody_publisher
  remote_user: root
  gather_facts: false
  any_errors_fatal: true

  vars:
    repo: "{{ playbook_dir }}/.."
    runtime_root: /root
    publisher_session: nova-nanobody-publisher
    chain_writer_session: nova-nanobody-miner

    # The chain writer's command line, in ONE place: the start task below runs
    # it, and the drift check compares it against what is actually running.
    # Anything added here -- a flag, a hotkey, a netuid -- therefore restarts a
    # writer that predates it.  Kept separate from the tmux/dotenv wrapper
    # because this is exactly what `ps -eo args` reports for the process.
    #
    # --chain-state-only is why this process is safe to run at all.  Its
    # CANDIDATES are the upstream example -- a random 1-30 mutation of a
    # hardcoded base sequence, "therefore not competitive" by its own docstring
    # -- and resolve_chain_writer.py must give it a REGISTERED hotkey or it
    # dies, so left submitting it overwrites one of our own fleet uids with
    # noise.  Observed live on uid 19.
    chain_writer_miner_argv:
      - /root/.pixi/envs/chain310/bin/python
      - neurons/miner/miner.py
      - --network
      - "{{ nanobody_network }}"
      - --netuid
      - "{{ nanobody_netuid }}"
      - --wallet.path
      - "{{ nanobody_wallet_path }}"
      - --wallet.name
      - "{{ nanobody_wallet_name }}"
      - --wallet.hotkey
      - "{{ nanobody_chain_writer_hotkey }}"
      - --chain-state-only
      - --logging.debug

    # The publisher is the service this deployment exists to run, so it is on
    # by default. The chain writer is off by default: it signs extrinsics, and
    # starting one as a side effect of a code deploy is not a thing a deploy
    # should be able to do.
    #
    # They are not independent. The publisher reads the chain view -- block,
    # epoch and the neuron rows it discovers the fleet from -- out of
    # /root/artifacts/chain_state.json, which only the connected miner process
    # writes. A publisher running without it logs "chain-state file is missing"
    # forever and looks alive, so the gates below refuse to start one against a
    # miner that cannot export that view.
    nanobody_publisher_activate: true
    nanobody_chain_writer_activate: false
    # The hotkey the chain writer constructs its wallet with. Which uids we
    # publish from is discovered from the chain and is NOT this value; this is
    # only the identity the writer process itself signs with.
    nanobody_chain_writer_hotkey: ""

    # Controller-side paths to the hotkey keyfiles to install, as a LIST.
    # These are locators, never values: Ansible reads the files locally and the
    # copy tasks are no_log. The coldkey is not in this list and must never be.
    # Discovered, not hand-listed. collect_hotkeys.yml stages whatever the
    # purchaser has bought into this directory; globbing it means a newly bought
    # hotkey reaches the box on the next deploy with no command line to update.
    # Passing a list literal through -e is how this went wrong once: Ansible took
    # `-e nanobody_hotkey_sources=[...]` as a STRING, the copy loop iterated over
    # its characters, and every item failed inside a no_log task that could not
    # say why.
    nanobody_hotkey_staging_dir: "{{ lookup('env', 'HOME') }}/.nova-hotkeys"
    nanobody_hotkey_sources: "{{ query('fileglob', nanobody_hotkey_staging_dir ~ '/*') | sort }}"
    nanobody_wallet_name: mining_ops
    nanobody_wallet_path: /root/.bittensor/wallets

    # Our coldkey's public ss58. The publisher discovers every uid this coldkey
    # holds from the metagraph each epoch. It is passed as a plain string
    # precisely so that nothing coldkey-shaped -- not even the public half --
    # has to be copied onto rented hardware.
    nanobody_coldkey_ss58: ""

    # Controller-side path to a file containing ONLY the GitHub token the
    # submission upload authenticates with. A locator, never the value: Ansible
    # reads the file itself and the task that writes it is no_log, so the token
    # reaches no command line, no variable this playbook prints, and no output.
    #
    # It is a token rather than an SSH deploy key because utils/files.py --
    # which is what the deployed miner calls -- PUTs to
    # api.github.com/repos/.../contents with a bearer GITHUB_TOKEN. The
    # deploy-key-and-git-push path belonged to the other branch's files.py.
    nanobody_github_token_file: ""
    nanobody_submission_repo_owner: thomasvangurp
    nanobody_submission_repo_name: nova-sn68-submissions
    nanobody_submission_repo_branch: main
    nanobody_submission_repo_path: data/results

    nanobody_watch_interval: 45
    nanobody_layer2_concurrency: 40
    nanobody_reserve_blocks: 55
    nanobody_netuid: 68
    nanobody_network: finney

  tasks:
    - name: Require committed deployment source
      ansible.builtin.command:
        argv: [git, -C, "{{ repo }}", status, --porcelain, --untracked-files=all]
      delegate_to: localhost
      vars:
        ansible_connection: local
      register: controller_status
      changed_when: false
      failed_when: controller_status.stdout | length > 0

    - name: Resolve committed deployment revision
      ansible.builtin.command:
        argv: [git, -C, "{{ repo }}", rev-parse, HEAD]
      delegate_to: localhost
      vars:
        ansible_connection: local
      register: controller_revision
      changed_when: false

    # Scoped to the paths the publisher executes, not the whole repository: an
    # ansible-only or docs-only commit moves HEAD without changing a line the
    # publisher runs, and comparing HEAD would report a false staleness every
    # time. This moves only when the publisher's own code does.
    - name: Resolve the revision of the publisher's source
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ repo }}"
          - log
          - -1
          - --format=%H
          - --
          - tools/publish_current_nanobody.py
          - nanobody_opt
      delegate_to: localhost
      vars:
        ansible_connection: local
      register: publisher_source_revision
      changed_when: false


    - name: Require the coldkey address the fleet is discovered by
      ansible.builtin.assert:
        that:
          - nanobody_coldkey_ss58 | length > 0
        fail_msg: >-
          Set nanobody_coldkey_ss58 to our coldkey's public ss58. The publisher
          discovers which uids we hold from the chain by this address; without it
          there is nothing to discover from, and a configured hotkey list is not
          an acceptable substitute (that is the failure that published into
          someone else's uid for twenty-one days).
      when: nanobody_publisher_activate | bool or nanobody_chain_writer_activate | bool

    - name: Refuse a publisher with no miner to read the chain view from
      ansible.builtin.assert:
        that:
          - nanobody_chain_writer_activate | bool
        fail_msg: >-
          The publisher reads the block, the epoch and the neuron rows it
          discovers the fleet from out of /root/artifacts/chain_state.json, and
          the miner is its only writer. Starting the publisher with the writer
          off produces a service that logs "miner chain-state is stale" every
          cycle and commits nothing while looking alive -- one deploy did
          exactly that. Pass nanobody_chain_writer_activate=true (deploy via
          deploy/nanobody_deploy.sh, which does), or set
          nanobody_publisher_activate=false to deploy code without starting it.
      when: nanobody_publisher_activate | bool

    # No fallback. The publisher treats the GPU count as a hard gate, so a
    # default here would substitute a guess for the one fact the rental knows.
    - name: Require the GPU count the inventory read off the rental
      ansible.builtin.assert:
        that:
          - gpu_count is defined
          - gpu_count | int > 0
        fail_msg: >-
          The inventory did not report num_gpus for {{ inventory_hostname }}.
          Pass -e gpu_count=N for this run and check why vastai omitted it.

    - name: Create the chain-side directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - {path: /root/artifacts, mode: "0700"}
        - {path: /root/artifacts/nanobody_history, mode: "0700"}
        - {path: /root/artifacts/validator_audits, mode: "0700"}
        - {path: /root/secrets, mode: "0700"}
        - {path: /root/submissions, mode: "0700"}
        - {path: "{{ nanobody_wallet_path }}/{{ nanobody_wallet_name }}/hotkeys", mode: "0700"}

    - name: Remove the second runtime root that deployed from another branch
      ansible.builtin.file:
        path: /root/nova-standalone
        state: absent

    # The Vast container has no running init, so these units were inert but
    # readable, and a readable service file describing a service nothing starts
    # is worse than none: it is documentation that lies.
    - name: Remove unusable systemd artifacts from the Vast container
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/nova-nanobody-miner.service
        - /etc/systemd/system/nova-nanobody-publisher.service
        - /etc/systemd/system/nova-nanobody-publisher.timer
        - /root/nova-standalone.env

    - name: Sync the committed runtime into the single root
      ansible.builtin.include_tasks: tasks/sync_repo.yml

    - name: Ship the locked Pixi workspace metadata
      ansible.builtin.copy:
        src: "{{ repo }}/{{ item }}"
        dest: "/root/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - pixi.toml
        - pixi.lock

    # A --locked install of an environment the lock does not describe fails with
    # a resolver message that reads like a network problem. Say what it actually
    # is, and how to fix it, because the fix needs an x86 Linux host: the
    # timelock and bittensor wheels cannot be cross-resolved on an ARM macOS
    # controller, which is what ansible/lock.yml exists for.
    - name: Check the lockfile describes the chain environment
      ansible.builtin.command:
        argv: [grep, -qE, '^  chain310:', /root/pixi.lock]
      changed_when: false
      failed_when: false
      register: chain_locked

    - name: Require a lockfile that includes the chain environment
      ansible.builtin.assert:
        that: chain_locked.rc == 0
        fail_msg: >-
          pixi.lock does not contain a chain310 environment. It was added to
          pixi.toml when the chain side moved onto this branch, but the lock has
          to be resolved on x86 Linux -- run
          `ansible-playbook -i ansible/inventory/vast_nanobody.py ansible/lock.yml`
          against this box first, commit the resulting pixi.lock, then re-run
          this playbook.
        success_msg: "pixi.lock describes the chain310 environment."

    - name: Install the locked chain environment
      ansible.builtin.command:
        argv:
          - /usr/local/bin/pixi
          - install
          - --manifest-path
          - /root/pixi.toml
          - --locked
          - --environment
          - chain310
      environment:
        PIXI_COLOR: never
      register: chain_install
      changed_when: "'Nothing to do' not in (chain_install.stdout ~ chain_install.stderr)"

    - name: Verify the chain stack is the cp310 timelock runtime
      ansible.builtin.command:
        argv:
          - /usr/local/bin/pixi
          - run
          - --manifest-path
          - /root/pixi.toml
          - --locked
          - --environment
          - chain310
          - python
          - -c
          - >-
            import sys,bittensor,timelock;
            from async_substrate_interface.sync_substrate import SubstrateInterface;
            assert sys.version_info[:2]==(3,10),sys.version;
            print('CHAIN310_OK',bittensor.__version__)
      environment:
        PIXI_COLOR: never
      changed_when: false
      register: chain_check

    # ---- Credentials -------------------------------------------------------
    # Hotkeys only, as many as exist. Each entry is a controller-side path; the
    # file content never appears in a playbook, a variable file, a command line
    # or task output.
    # A string here would be iterated character by character inside a no_log
    # task, which reports a failure it cannot explain. Fail with a sentence
    # instead.
    - name: Require the hotkey sources to be a list of paths
      ansible.builtin.assert:
        that:
          - nanobody_hotkey_sources is sequence
          - nanobody_hotkey_sources is not string
        fail_msg: >-
          nanobody_hotkey_sources must be a list, not
          {{ nanobody_hotkey_sources | type_debug }}. Pass it with -e @file.json,
          or leave it unset and let it glob
          {{ nanobody_hotkey_staging_dir }} after running collect_hotkeys.yml.

    # An empty list is a list, and that is the hole. If collect_hotkeys.yml never
    # ran, or ran on a controller with a different HOME, the glob returns [] --
    # the copy loop below then has nothing to do and SKIPS without failing, and
    # "Require at least one hotkey to publish from" is satisfied by whatever an
    # earlier deploy left on the box. The deploy then reports "N hotkey(s)
    # deployed" having deployed none of the ones the purchaser has since bought,
    # which is indistinguishable from buying nothing -- the failure the whole
    # collect-then-install sequence exists to prevent.
    - name: Require the hotkey list to name at least one keyfile
      ansible.builtin.assert:
        that: nanobody_hotkey_sources | length > 0
        fail_msg: >-
          nanobody_hotkey_sources is empty: nothing is staged in
          {{ nanobody_hotkey_staging_dir }} on this controller. This run would
          install no keyfile at all and still pass its hotkey gate on whatever an
          earlier deploy left on {{ inventory_hostname }}. Run
          ansible/collect_hotkeys.yml first -- site.yml does it for you, and it
          fails loudly if the purchase host holds nothing.
        success_msg: >-
          {{ nanobody_hotkey_sources | length }} keyfile(s) staged for install.
      when: nanobody_publisher_activate | bool or nanobody_chain_writer_activate | bool

    - name: Install every hotkey keyfile this fleet uses
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ nanobody_wallet_path }}/{{ nanobody_wallet_name }}/hotkeys/{{ item | basename }}"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ nanobody_hotkey_sources }}"
      loop_control:
        label: "{{ item | basename }}"
      no_log: true

    - name: Count the hotkeys present on the box
      ansible.builtin.find:
        paths: "{{ nanobody_wallet_path }}/{{ nanobody_wallet_name }}/hotkeys"
        file_type: file
      register: installed_hotkeys

    # Deliberately a count and not a set of expected addresses. Which uids these
    # keys hold is a fact about the chain, is answered by the publisher from the
    # metagraph every epoch, and must not be restated here where it can go stale.
    - name: Require at least one hotkey to publish from
      ansible.builtin.assert:
        that: installed_hotkeys.matched | int > 0
        fail_msg: >-
          No hotkey keyfile is present under
          {{ nanobody_wallet_path }}/{{ nanobody_wallet_name }}/hotkeys. Pass the
          controller-side paths as nanobody_hotkey_sources.
        success_msg: >-
          {{ installed_hotkeys.matched }} hotkey(s) available; the publisher
          resolves which of them hold uids from the chain.
      when: nanobody_publisher_activate | bool or nanobody_chain_writer_activate | bool

    # Names only; the contents are never read back off the box. "At least one"
    # cannot see a copy loop that partially failed, and that loop is no_log, so
    # its own failure message says nothing useful. Compare the sets instead: a
    # keyfile the controller staged and the box does not hold is a uid the
    # publisher will discover from the chain and then be unable to sign for.
    - name: Require every staged keyfile to have landed on the box
      ansible.builtin.assert:
        that:
          - nanobody_hotkeys_missing | length == 0
        fail_msg: >-
          Staged but not present on {{ inventory_hostname }}:
          {{ nanobody_hotkeys_missing }}. The install loop is no_log, so check
          {{ nanobody_hotkey_staging_dir }} is readable and re-run; do not
          activate the publisher against a partial fleet.
        success_msg: >-
          All {{ nanobody_hotkey_sources | length }} staged keyfile(s) are on the
          box.
      vars:
        nanobody_hotkeys_missing: >-
          {{ nanobody_hotkey_sources | map('basename') | list
             | difference(installed_hotkeys.files
                          | map(attribute='path') | map('basename') | list) }}
      when: nanobody_publisher_activate | bool or nanobody_chain_writer_activate | bool

    - name: Refuse coldkey material on the rental
      ansible.builtin.find:
        paths: "{{ nanobody_wallet_path }}"
        # Any coldkey-shaped file, not the one exact name: coldkeypub.txt,
        # coldkey.bak and mining_ops_coldkey all passed a gate whose whole
        # purpose is that no coldkey material reaches rented hardware. Nothing
        # on the box matches today, so this is a free strengthening of a
        # boundary gate rather than a fix for a live miss.
        patterns: ["*coldkey*"]
        recurse: true
        file_type: file
      register: rental_coldkeys

    - name: Assert the rental contains no coldkey
      ansible.builtin.assert:
        that: rental_coldkeys.matched | int == 0
        fail_msg: >-
          Coldkey material found under {{ nanobody_wallet_path }} on rented
          hardware. Remove it and treat it as compromised. Registrations are
          bought from the operator's machine (ansible/slots.yml) precisely so
          this never has to happen here.
        success_msg: "No coldkey on the rental."

    # ---- Runtime configuration --------------------------------------------
    # Every key here is read by the code this playbook deploys, and the gate
    # below proves it against the deployed source.
    #
    # The first draft of this file carried nine keys inherited from the other
    # branch's miner that nothing here reads: NOVA_NANOBODY_ONLY,
    # NOVA_LIVE_CONFIG, NOVA_WALLET_NAME, NOVA_WALLET_PATH, NOVA_COLDKEY_SS58,
    # NOVA_GIT_PUSH, NOVA_DEPLOY_KEY, NOVA_GIT_WORKDIR, and AUTO_UPDATE -- which
    # is read, but only by neurons/validator/validator.py, and we are a miner.
    # Configuration nothing reads is worse than absent: it is a written record of
    # behaviour that is not happening.
    #
    # NOVA_WALLET_* is gone for a second reason as well. The wallet reaches the
    # miner as --wallet.name/--wallet.path/--wallet.hotkey, and which uids we
    # publish from is discovered from the chain, never configured.
    #
    # NOVA_NANOBODY_RESULT stays: compound_miner/nanobody_provider.py falls back
    # to it when no explicit path is passed, so it is set to the same file the
    # publisher is given as --artifact rather than left to disagree with it.
    #
    # The lookup('file', ...) that reads the token lives inside the no_log task
    # below, which means a wrong or unreadable path fails with its own reason
    # suppressed -- the same shape as the copy loop that iterated the characters
    # of a string and could not say why. Resolve the LOCATOR here, where the
    # message survives. get_checksum/get_mime/get_attributes are off so this task
    # does not read the file's bytes at all, and nothing about it is registered
    # except existence and size.
    - name: Resolve the GitHub token locator before anything no_log reads it
      ansible.builtin.stat:
        path: "{{ nanobody_github_token_file }}"
        get_checksum: false
        get_mime: false
        get_attributes: false
      delegate_to: localhost
      vars:
        ansible_connection: local
      register: nanobody_github_token_locator
      changed_when: false
      when: nanobody_github_token_file | length > 0

    - name: Require the GitHub token locator to point at a non-empty file
      ansible.builtin.assert:
        that:
          - nanobody_github_token_locator.stat.exists
          - nanobody_github_token_locator.stat.isreg
          - nanobody_github_token_locator.stat.size > 0
        fail_msg: >-
          nanobody_github_token_file is {{ nanobody_github_token_file }}, which
          is not a non-empty regular file on this controller. The task that reads
          it is no_log, so lookup('file') would fail there with the reason
          hidden. Point it at a file holding only the token for
          {{ nanobody_submission_repo_owner }}/{{ nanobody_submission_repo_name }},
          or leave it empty to deploy without a submission credential.
        success_msg: "GitHub token locator resolves; its value was not read."
      when: nanobody_github_token_file | length > 0

    # mode 0600 and no_log because GITHUB_TOKEN is in it.
    - name: Install the chain-side runtime configuration
      ansible.builtin.copy:
        dest: /root/nanobody.env
        owner: root
        group: root
        mode: "0600"
        content: |
          SUBTENSOR_NETWORK={{ nanobody_network }}
          BT_NO_PARSE_CLI_ARGS=false
          NOVA_LIVE_SEARCH=0
          NOVA_CHAIN_STATE=/root/artifacts/chain_state.json
          NOVA_NANOBODY_RESULT=/root/artifacts/nanobody_result.json
          GITHUB_REPO_OWNER={{ nanobody_submission_repo_owner }}
          GITHUB_REPO_NAME={{ nanobody_submission_repo_name }}
          GITHUB_REPO_BRANCH={{ nanobody_submission_repo_branch }}
          GITHUB_REPO_PATH={{ nanobody_submission_repo_path }}
          {% if nanobody_github_token_file | length > 0 %}
          GITHUB_TOKEN={{ lookup('file', nanobody_github_token_file) | trim }}
          {% endif %}
      no_log: true

    # Names only. The values are never read back off the box, and the key names
    # are not secret -- GITHUB_TOKEN's presence is the fact being asserted.
    - name: List the configuration keys actually written
      ansible.builtin.shell: |
        set -eu
        cut -d= -f1 /root/nanobody.env | grep -v '^$'
      args:
        executable: /bin/bash
      changed_when: false
      register: configured_keys

    # A key nothing reads is drift, and this is how nine of them got here. The
    # deployed source is the authority, so ask it rather than a reviewer.
    #
    # This is a floor, not a proof: it searches the whole deployed tree, so a key
    # only the validator reads would pass. It catches the failure that actually
    # happened -- a key from another branch's miner that exists nowhere here.
    - name: Find configuration keys no deployed code reads
      ansible.builtin.shell: |
        set -u
        dead=""
        for key in {{ configured_keys.stdout_lines | join(' ') }}; do
          if ! grep -Rqs --include='*.py' "$key" \
              /root/neurons /root/utils /root/nanobody_opt /root/compound_miner \
              /root/tools /root/config; then
            dead="$dead $key"
          fi
        done
        echo "DEAD:$dead"
      args:
        executable: /bin/bash
      changed_when: false
      register: dead_keys

    - name: Require every configured key to be read by something
      ansible.builtin.assert:
        that: dead_keys.stdout | trim == 'DEAD:'
        fail_msg: >-
          /root/nanobody.env sets keys that no deployed module reads
          ({{ dead_keys.stdout | trim | replace('DEAD:', '') }}). Either the
          code that reads them was not merged, or they are left over from
          another branch's miner. Remove them or merge that code; do not leave a
          runtime configuration describing behaviour that is not happening.
        success_msg: >-
          All {{ configured_keys.stdout_lines | length }} configured keys are
          read by deployed code.

    - name: Require the submission credential the deployed uploader needs
      ansible.builtin.assert:
        that: "'GITHUB_TOKEN' in configured_keys.stdout_lines"
        fail_msg: >-
          utils/files.py:upload_file_to_github raises unless GITHUB_TOKEN is
          set, so the chain writer would submit nothing. Point
          nanobody_github_token_file at a controller-side file holding the
          token for
          {{ nanobody_submission_repo_owner }}/{{ nanobody_submission_repo_name }}.
      when: nanobody_chain_writer_activate | bool

    - name: Remove the stale implicit dotenv file
      ansible.builtin.file:
        path: /root/.env
        state: absent

    # ---- Safety gate -------------------------------------------------------
    # Everything from here to the first kill-session runs while the existing
    # publisher is still publishing.
    - name: Name the publisher's launcher and arguments once
      ansible.builtin.set_fact:
        # The publisher spawns the commit driver, and that driver resolves the
        # on-chain commit content from GITHUB_REPO_* and authenticates the
        # upload with GITHUB_TOKEN. The miner is launched through dotenv for
        # exactly this reason; the publisher was not, so every uid reached the
        # last step of the epoch and died on "Missing one or more GitHub
        # environment variables". Same file, same wrapper, one environment.
        nanobody_publisher_launcher:
          - /root/.pixi/envs/chain310/bin/python
          - -m
          - dotenv
          - -f
          - /root/nanobody.env
          - run
          - --
          - /usr/local/bin/pixi
          - run
          - --manifest-path
          - /root/pixi.toml
          - --locked
          - --environment
          - chain310
          - publish-current-nanobody
          - --
        nanobody_publisher_arguments:
          - --watch-interval
          - "{{ nanobody_watch_interval }}"
          - --network
          - "{{ nanobody_network }}"
          - --netuid
          - "{{ nanobody_netuid }}"
          # From the rental, not from a vars file. The publisher fails closed on
          # an unexpected count, and a written-down 10 is wrong the first time a
          # differently shaped box is rented.
          - --expected-gpus
          - "{{ gpu_count }}"
          - --runtime-root
          - /root
          - --score-bank-root
          - /root
          - --nanobody-opt-root
          - /root/nanobody_opt
          - --pixi
          - /usr/local/bin/pixi
          - --layer2-concurrency
          - "{{ nanobody_layer2_concurrency }}"
          - --layer2-cache-dir
          - /root/layer2_cache
          - --chain-state
          - /root/artifacts/chain_state.json
          - --artifact
          - /root/artifacts/nanobody_result.json
          - --history-dir
          - /root/artifacts/nanobody_history
          - --audit-dir
          - /root/artifacts/validator_audits
          - --ledger
          - /root/artifacts/nanobody_published_sequences.txt
          - --state
          - /root/artifacts/nanobody_publisher_state.json
          - --coldkey
          - "{{ nanobody_coldkey_ss58 }}"
          - --wallet-name
          - "{{ nanobody_wallet_name }}"
          - --wallet-path
          - "{{ nanobody_wallet_path }}"
          - --reserve-blocks
          - "{{ nanobody_reserve_blocks }}"
          # The qualified stage.  With this off every epoch published at
          # stage=provisional -- the evidence floor only, no quality gate at
          # all.  It was cut from the live path when it ran BEFORE the commit
          # and made fleets reach the chain late; the commit moved ahead of it,
          # so what is left is an upgrade attempt on a fleet that is already
          # on chain.  The reserve is what keeps it free: it will not start
          # inside the last 220 blocks of an epoch, so it can never delay the
          # next cycle.
          - --strict-qualification
          - --strict-qualification-reserve-blocks
          - "{{ nanobody_strict_qualification_reserve_blocks | default(220) }}"
          # One commitment per uid, each signed by that uid's own hotkey. Without
          # this the publisher selects a distinct sequence for every uid the
          # coldkey holds and then only one is ever sent, because a commitment is
          # signed by a wallet and a wallet is one hotkey. With three uids that is
          # two thirds of the fleet idle, and the waste grows with every slot
          # bought. {hotkey} arrives as an ss58 from the chain; the driver
          # resolves it to the local key file.
          - --commit-command
          - >-
            /root/.pixi/envs/chain310/bin/python -m nanobody_opt.commit_submission
            --uid {uid} --hotkey {hotkey} --sequence {sequence}
            --wallet-name {{ nanobody_wallet_name }}
            --wallet-path {{ nanobody_wallet_path }}
            --netuid {{ nanobody_netuid | default(68) }}
            --network {{ nanobody_network | default('finney') }}

    - name: Compile the deployed publisher and chain writer
      ansible.builtin.command:
        argv:
          - /root/.pixi/envs/chain310/bin/python
          - -m
          - py_compile
          - /root/tools/publish_current_nanobody.py
          - /root/compound_miner/nanobody_provider.py
          - /root/nanobody_opt/fleet.py
          - /root/nanobody_opt/chain_state.py
          - /root/neurons/miner/miner.py
      changed_when: false

    - name: Run the focused publisher tests against the deployed tree
      ansible.builtin.command:
        argv:
          - /root/.pixi/envs/chain310/bin/python
          - -m
          - pytest
          - -q
          - tests/test_publish_current_nanobody.py
          # Covers the seam itself: the publisher's _chain_view parsing what the
          # miner writes, and discover_fleet picking our uids out of a roster.
          # Run on the box against the deployed tree, so a deploy proves the
          # code it just installed rather than the code the controller holds.
          - tests/test_chain_state.py
      args:
        chdir: /root
      changed_when: false
      register: publisher_tests

    - name: Verify the publisher accepts every argument it is deployed with
      ansible.builtin.include_tasks: tasks/verify_entrypoint.yml
      vars:
        entrypoint_name: publish-current-nanobody
        entrypoint_argv: "{{ nanobody_publisher_launcher }}"
        entrypoint_flags: "{{ nanobody_publisher_arguments | select('match', '^--') | list }}"
        entrypoint_environment:
          PIXI_COLOR: never

    # The cross-program contract the publisher cannot check for itself until it
    # is already running: it needs the miner to export a chain view carrying the
    # neuron rows the fleet is discovered from, and it cannot fall back to a
    # remembered uid. Without it the publisher starts, logs one line an interval
    # and publishes nothing.
    #
    # tests/test_chain_state.py above proves the payload and the parsing. What a
    # test cannot prove is that the DEPLOYED miner still calls the exporter, so
    # that is what is checked here, against the real symbol names.
    - name: Verify the deployed miner exports the chain view the publisher reads
      ansible.builtin.shell: |
        set -eu
        grep -q 'from nanobody_opt import chain_state' /root/neurons/miner/miner.py
        grep -q '_publish_chain_state(' /root/neurons/miner/miner.py
        grep -q 'NOVA_CHAIN_STATE' /root/neurons/miner/miner.py
        grep -q 'def neuron_rows' /root/nanobody_opt/chain_state.py
        echo CHAIN_STATE_EXPORT_PRESENT
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      register: chain_state_export

    - name: Require a miner that exports block, epoch and neuron rows
      ansible.builtin.assert:
        that: "'CHAIN_STATE_EXPORT_PRESENT' in chain_state_export.stdout"
        fail_msg: >-
          The deployed miner does not call nanobody_opt.chain_state to export a
          chain view. The publisher discovers the fleet from those neuron rows
          and has no fallback, so it would run and publish nothing.
        success_msg: "Miner exports the chain view the publisher reads."
      when: nanobody_publisher_activate | bool or nanobody_chain_writer_activate | bool

    # The wire format is the whole submission. commitments.py refuses a
    # payload that does not hold exactly one "|" between the molecule section
    # and the sequence section, and refuses it before scoring, similarity or
    # any validity check -- invisibly, from our side. This driver sent the bare
    # sequence for every uid of every epoch.
    - name: Verify the commit driver emits the validator's submission format
      ansible.builtin.shell: |
        set -eu
        grep -q 'def submission_message' /root/nanobody_opt/commit_submission.py
        grep -q 'submission_message(args.sequence)' /root/nanobody_opt/commit_submission.py
        grep -q 'NULL_TOKEN = "~"' /root/neurons/validator/commitments.py
        echo SUBMISSION_FORMAT_PRESENT
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      register: submission_format

    - name: Require a commit driver the validator can parse
      ansible.builtin.assert:
        that: "'SUBMISSION_FORMAT_PRESENT' in submission_format.stdout"
        fail_msg: >-
          The commit driver does not build the validator's "molecules|sequences"
          payload, or the validator's null token has changed. Every uid would
          be discarded at parse time and the fleet would score nothing while
          reporting COMMIT_OK for every uid.
        success_msg: "Commit driver emits the validator's submission format."
      when: nanobody_publisher_activate | bool

    # The validator's duplicate gates are the difference between six tickets
    # and none: a UID whose sequence is >=0.95 identical to a top sequence, or
    # shares a CDR3 at >=0.85, is dropped before scoring. That check existed in
    # the repository as a manual pixi task while the live publisher never
    # called it, and every ticket we committed was discarded silently. Assert
    # the deployed publisher runs it, against the real symbol names.
    - name: Verify the deployed publisher replays the validator's duplicate gates
      ansible.builtin.shell: |
        set -eu
        grep -q '_novelty_command(' /root/tools/publish_current_nanobody.py
        grep -q 'check-validator-novelty' /root/tools/publish_current_nanobody.py
        grep -q '_validator_novel_sequences(' /root/tools/publish_current_nanobody.py
        grep -q 'def duplicate_reason' /root/nanobody_opt/check_validator_novelty.py
        echo NOVELTY_GATE_PRESENT
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      register: novelty_gate

    - name: Require a publisher that cannot commit a validator duplicate
      ansible.builtin.assert:
        that: "'NOVELTY_GATE_PRESENT' in novelty_gate.stdout"
        fail_msg: >-
          The deployed publisher does not run check-validator-novelty. Every
          uid would commit a sequence the validator discards before scoring,
          which looks exactly like a healthy fleet from this side: six
          COMMIT_OK lines and no leaderboard row.
        success_msg: "Publisher replays the validator's duplicate gates."
      when: nanobody_publisher_activate | bool

    # The same check for the commit driver, and it is not redundant with the
    # miner's: commit_submission defers its imports into main(), so --help
    # exits 0 on a box where every one of them is missing. Every uid in the
    # fleet failed with "No module named 'btdr'" while the miner beside it
    # committed happily, because the miner appends /root and /root/utils to
    # sys.path and this program did not. --self-test runs the real import
    # block, in the real interpreter the --commit-command names.
    - name: Verify the commit driver's own imports resolve in the chain environment
      ansible.builtin.command:
        # Through dotenv, because that is how the publisher that spawns it is
        # launched. Running the gate in a barer environment than the real one
        # is how a green deploy still commits nothing.
        cmd: >-
          /root/.pixi/envs/chain310/bin/python -m dotenv -f /root/nanobody.env
          run -- /root/.pixi/envs/chain310/bin/python
          -m nanobody_opt.commit_submission --self-test
        chdir: /root
      changed_when: false
      failed_when: false
      register: commit_self_test

    - name: Require a commit driver that can actually import what it commits with
      ansible.builtin.assert:
        that: "'COMMIT_SELF_TEST_OK' in commit_self_test.stdout"
        fail_msg: >-
          The commit driver cannot import its dependencies under
          /root/.pixi/envs/chain310. Every uid would fail at the last step of
          the epoch, after the fleet had been published, which is the most
          expensive place to discover it. Output: {{ commit_self_test.stdout }}
          {{ commit_self_test.stderr }}
        success_msg: "Commit driver imports resolve; the fleet can commit."
      when: nanobody_publisher_activate | bool

    # py_compile above proves the miner parses; it does not prove the chain
    # environment can satisfy its imports. The miner is import-safe by
    # construction -- module level is only sys.path setup and getattr aliases,
    # everything else is behind __main__ -- so importing it here is the cheapest
    # honest check that the process will actually start. This is the gate that
    # catches a third-party dependency the chain310 feature does not declare.
    - name: Verify the chain environment satisfies the deployed miner's imports
      ansible.builtin.command:
        argv:
          - /root/.pixi/envs/chain310/bin/python
          - -c
          - >-
            import importlib.util, sys;
            spec = importlib.util.spec_from_file_location(
                'deployed_miner', '/root/neurons/miner/miner.py');
            module = importlib.util.module_from_spec(spec);
            spec.loader.exec_module(module);
            print('MINER_IMPORTS_OK')
      args:
        chdir: /root
      changed_when: false
      register: miner_imports

    - name: Require a signing identity for the chain writer
      ansible.builtin.assert:
        that: nanobody_chain_writer_hotkey | length > 0
        fail_msg: >-
          Set nanobody_chain_writer_hotkey to the hotkey name the writer process
          signs with. It is not the fleet -- the fleet comes from the chain.
      when: nanobody_chain_writer_activate | bool

    # A NAME is not an identity. resolve_chain_writer.py only ever returns a
    # hotkey the chain currently maps to our coldkey, but NOVA_CHAIN_WRITER_HOTKEY
    # overrides it entirely -- and an override is exactly how a dead key gets in.
    # nova68-slot-10 was named that way on a fresh box, having been deregistered
    # minutes earlier, and the miner died on
    #     ValueError: '5Eh7...' is not in list
    # from metagraph.hotkeys.index(). Checking here turns a runtime death into a
    # failed deploy that names the problem.
    - name: Require the chain writer's hotkey to be registered right now
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          python3 - <<'PY'
          import json, glob, os, sys
          name = "{{ nanobody_chain_writer_hotkey }}"
          coldkey = "{{ nanobody_coldkey_ss58 }}"
          state = json.load(open("/root/artifacts/chain_state.json"))
          ours = {r["hotkey"] for r in state["neurons"]
                  if str(r.get("coldkey") or "") == coldkey}
          for path in glob.glob("/root/.bittensor/wallets/*/hotkeys/*"):
              if path.endswith("pub.txt") or os.path.basename(path) != name:
                  continue
              try:
                  address = json.load(open(path)).get("ss58Address")
              except Exception:
                  continue
              if address in ours:
                  print("registered")
                  sys.exit(0)
              print("NOT REGISTERED", file=sys.stderr)
              sys.exit(1)
          print("no such hotkey file on the box", file=sys.stderr)
          sys.exit(1)
          PY
        executable: /bin/bash
      register: chain_writer_registered
      changed_when: false
      failed_when: chain_writer_registered.rc != 0
      when: nanobody_chain_writer_activate | bool

    # ---- Services ----------------------------------------------------------
    - name: Restart the checkpoint publisher on committed source
      ansible.builtin.command:
        argv: [tmux, kill-session, -t, "{{ publisher_session }}"]
      register: publisher_stop
      changed_when: publisher_stop.rc == 0
      failed_when: false
      when: nanobody_publisher_activate | bool

    - name: Start autonomous current-epoch checkpoint publication
      ansible.builtin.command:
        argv: >-
          {{ ['tmux', 'new-session', '-d', '-s', publisher_session]
             + nanobody_publisher_launcher + nanobody_publisher_arguments }}
      args:
        chdir: /root
      changed_when: true
      when: nanobody_publisher_activate | bool

    - name: Confirm the checkpoint publisher remains alive
      ansible.builtin.command:
        argv: [tmux, has-session, -t, "{{ publisher_session }}"]
      changed_when: false
      when: nanobody_publisher_activate | bool

    # The revision the RUNNING publisher process was launched from, as opposed
    # to the revision that merely sits on disk. A source deploy that does not
    # restart the publisher leaves the two disagreeing, and the publisher goes
    # on committing from the code it started with. That is silent: the process
    # stays healthy and the play reports success. Epoch 25116 found a publisher
    # fourteen hours old that had missed every deploy of the day.
    - name: Stamp the revision the publisher is running
      ansible.builtin.copy:
        content: "{{ publisher_source_revision.stdout }}\n"
        dest: /root/artifacts/nanobody_publisher_running_commit.txt
        owner: root
        group: root
        mode: "0644"
      when: nanobody_publisher_activate | bool

    - name: Keep the chain writer stopped unless it was explicitly activated
      ansible.builtin.command:
        argv: [tmux, kill-session, -t, "{{ chain_writer_session }}"]
      register: chain_writer_stop
      changed_when: chain_writer_stop.rc == 0
      failed_when: false
      when: not (nanobody_chain_writer_activate | bool)

    - name: Check whether the chain writer is already running
      ansible.builtin.command:
        argv: [tmux, has-session, -t, "{{ chain_writer_session }}"]
      register: chain_writer_status
      changed_when: false
      failed_when: false

    # A running session is not the same as a CORRECT one. The writer signs with
    # a hotkey named at deploy time, and the fleet churns: nova68-slot-12 was
    # deregistered while the miner held it, and because the session existed the
    # next deploy resolved the right replacement and then skipped the restart
    # under `chain_writer_status.rc != 0`. The miner went on signing with a key
    # the metagraph no longer knows, which is publish_metadata_extrinsic failing
    # "Custom error: 19" every cycle while every process looks healthy -- the
    # exact failure resolve_chain_writer.py exists to prevent, reintroduced one
    # layer up.
    - name: Read the hotkey the running chain writer actually signs with
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ps -eo args | grep '[n]eurons/miner/miner.py' \
            | tr ' ' '\n' | grep -A1 -x -- '--wallet.hotkey' | tail -1
        executable: /bin/bash
      register: chain_writer_running_hotkey
      changed_when: false
      failed_when: false
      when: chain_writer_status.rc == 0

    - name: Stop a chain writer signing with the wrong hotkey
      ansible.builtin.command:
        argv: [tmux, kill-session, -t, "{{ chain_writer_session }}"]
      register: chain_writer_replaced
      changed_when: chain_writer_replaced.rc == 0
      failed_when: false
      when:
        - chain_writer_status.rc == 0
        - (chain_writer_running_hotkey.stdout | default('') | trim) | length > 0
        - (chain_writer_running_hotkey.stdout | trim) != nanobody_chain_writer_hotkey

    # The hotkey was the first argument to drift, not the last.  --chain-state-only
    # was added to stop the writer committing example candidates on uid 19, the
    # deploy ran green, and the flag reached nothing: the session already
    # existed, so the start task was skipped under `chain_writer_status.rc != 0`
    # and the old process went on committing.  Compare the WHOLE command line.
    - name: Read the command line the running chain writer was started with
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ps -eo args | grep -m1 -- '[n]eurons/miner/miner.py'
        executable: /bin/bash
      register: chain_writer_running_args
      changed_when: false
      failed_when: false
      when: chain_writer_status.rc == 0

    - name: Stop a chain writer running a different command line
      ansible.builtin.command:
        argv: [tmux, kill-session, -t, "{{ chain_writer_session }}"]
      register: chain_writer_stale_args
      changed_when: chain_writer_stale_args.rc == 0
      failed_when: false
      when:
        - chain_writer_status.rc == 0
        - (chain_writer_running_args.stdout | default('') | trim) | length > 0
        - >-
          (chain_writer_running_args.stdout | trim)
          != (chain_writer_miner_argv | map('string') | join(' '))

    # Re-check, so the start task below sees the session is gone and replaces it.
    - name: Re-check whether the chain writer is running
      ansible.builtin.command:
        argv: [tmux, has-session, -t, "{{ chain_writer_session }}"]
      register: chain_writer_status
      changed_when: false
      failed_when: false

    - name: Refuse an unmanaged duplicate chain writer
      ansible.builtin.command:
        argv: [pgrep, -f, "[n]eurons/miner/miner.py"]
      register: chain_writer_processes
      changed_when: false
      failed_when: false

    # Two writers on one hotkey overwrite each other's commitment and the epoch
    # is scored on whichever landed last. If one is running outside the managed
    # session, stop it by hand rather than adding a second.
    - name: Assert no chain writer runs outside the managed session
      ansible.builtin.assert:
        that: chain_writer_status.rc == 0 or chain_writer_processes.rc != 0
        fail_msg: >-
          neurons/miner/miner.py is running (pid
          {{ chain_writer_processes.stdout }}) but not in the managed tmux
          session {{ chain_writer_session }}. Stop it before activating.
      when: nanobody_chain_writer_activate | bool

    - name: Start the on-chain commitment writer
      ansible.builtin.command:
        argv: >-
          {{ ['tmux', 'new-session', '-d', '-s', chain_writer_session,
              '/root/.pixi/envs/chain310/bin/python', '-m', 'dotenv',
              '-f', '/root/nanobody.env', 'run', '--']
             + chain_writer_miner_argv }}
      args:
        chdir: /root
      changed_when: true
      when:
        - nanobody_chain_writer_activate | bool
        - chain_writer_status.rc != 0

    - name: Record the successfully validated chain-side revision
      ansible.builtin.copy:
        content: "{{ controller_revision.stdout }}\n"
        dest: /root/artifacts/nanobody_chain_deployed_commit.txt
        owner: root
        group: root
        mode: "0644"

    - name: Report the chain side
      ansible.builtin.debug:
        msg: >-
          {{ chain_check.stdout }}; {{ miner_imports.stdout }};
          {{ publisher_tests.stdout_lines[-1] | default('tests ok') }};
          {{ installed_hotkeys.matched }} hotkey(s) deployed;
          publisher active={{ nanobody_publisher_activate | bool }};
          chain writer active={{ nanobody_chain_writer_activate | bool }}
