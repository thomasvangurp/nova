# Dormant profile for the validated 21.2x exact scorer.
#
# Keep activation false until the gates in
# nanobody_opt/RD_BUDGET_ALLOCATION_2026-09-11.md pass on the box.  The shape
# below is not "ten times the old profile": the measured limit on published
# score is selection accuracy, not candidate count, so most of the added
# throughput buys independent observations of a shortlist rather than more
# one-shot candidates.
nanobody_producer_activate: false
# The fast scorer spells two contract flags differently, so it is driven
# through the adapter rather than invoked directly.  Rollback is this one path.
nanobody_exact_scorer: /root/nanobody_opt/score_boltzgen_fast_adapter.py

# Proposal generation still explores breadth-first; the exact screen consumes
# only the strongest Layer-2 survivors.
nanobody_parent_limit: 256
nanobody_neighbor_parent_limit: 128
nanobody_recent_anchor_parent_limit: 32
nanobody_recent_neighbor_parent_limit: 64
nanobody_basin_core_limit: 40
nanobody_basin_parent_limit: 160
nanobody_neighbor_seed_count: 128
nanobody_proposals_per_seed: 24
nanobody_proposal_limit: 3200
nanobody_basin_fraction: 0.80
nanobody_basin_routes_per_core: 256
nanobody_basin_evidence_fraction: 0.50
nanobody_basin_evidence_core_limit: 16
nanobody_basin_top_core_weight: 2
nanobody_basin_exploration_residues_per_position: 6
nanobody_maximum_exhaustive_singles: 32768

# Measured operating point at 8.3 GPU-seconds per sequence: 2,400 one-shot
# screens in tranches of 800, then a 60-candidate shortlist re-observed ten
# times -- about 2,940 observations.  The screen window is not the whole epoch:
# Layer 2 takes 13-22 minutes at this proposal count, so the budget is sized
# against roughly 40 minutes of scoring, not 61.
#
# Tranches of 800 give each of ten workers eighty sequences.  The only
# remaining non-GPU cost is one model load per invocation, so large waves are
# what converts the speedup into throughput; multi-worker packing and predict
# batching were both measured as dead ends.
nanobody_candidate_limit: 2400
nanobody_screen_tranche_size: 800
nanobody_weak_initial_fallback_after: 1200
nanobody_finalists: 60
nanobody_qualification_observations: 10

# The screen loop admits at most one finalist per tranche, so the shortlist is
# replicated explicitly after screening: nine rounds, each one scorer
# invocation over all sixty candidates, giving every one of them ten
# independent observations.
nanobody_replication_rounds: 9

# Nine rounds over sixty candidates is about 810 seconds of GPU work, so
# screening must stop roughly 68 blocks before the commitment reserve.  Without
# this, a long screen consumes the epoch and every candidate is published on a
# single observation -- the exact failure the shortlist exists to prevent.
nanobody_replication_reserve_blocks: 68

# Full TNP costs about two seconds per uncached sequence and is GPU-resident:
# 3,200 novel candidates would be roughly 107 minutes, which does not fit an
# epoch at all.  Screen the pool on IgBLAST (42 ms/seq at batch one, 21 ms at
# batch eight) and spend full TNP only on the replication shortlist, which the
# race gates before anything can be published.
nanobody_layer2_igblast_only: true
nanobody_igblast_batch_size: 8

# One observation of a fixed sequence lands within about 34 leaderboard rank
# points of its own mean, so a shortlist of five chosen on single observations
# is mostly choosing noise.  Overlapping the per-tranche ranking and database
# update with the next tranche's folding pays for several extra replication
# rounds.
nanobody_pipeline_depth: 1

# With resident models the chunk no longer amortises a model load, so this is
# only work-directory size and failure blast radius.  Keep it small and fixed so
# a larger tranche cannot change how candidates are grouped.
nanobody_screen_predict_batch_size: 2

# Strict qualification thresholds are calibrated against the production
# scorer's observations.  Point this at re-derived thresholds before activating
# a replacement scorer; do not inherit the production values.
nanobody_strict_gates: ""

# Multi-worker packing measured 1.21x for triple the memory, so the wave layer
# stays at one shard per GPU; there is deliberately no knob for it.
