# Dormant profile for the validated 12.2x exact scorer.
#
# Keep activation false until the gates in
# nanobody_opt/RD_BUDGET_ALLOCATION_2026-09-11.md pass on the box.  The shape
# below is not "ten times the old profile": the measured limit on published
# score is selection accuracy, not candidate count, so most of the added
# throughput buys independent observations of a shortlist rather than more
# one-shot candidates.
nanobody_producer_activate: false
nanobody_exact_scorer: /root/fastscore/release/fast_score_batch.py

# Proposal generation still explores breadth-first; the exact screen consumes
# only the strongest Layer-2 survivors.
nanobody_parent_limit: 256
nanobody_neighbor_parent_limit: 128
nanobody_recent_anchor_parent_limit: 32
nanobody_recent_neighbor_parent_limit: 64
nanobody_basin_core_limit: 40
nanobody_basin_parent_limit: 160
nanobody_neighbor_seed_count: 128
nanobody_proposals_per_seed: 24
nanobody_proposal_limit: 3200
nanobody_basin_fraction: 0.80
nanobody_basin_routes_per_core: 256
nanobody_basin_evidence_fraction: 0.50
nanobody_basin_evidence_core_limit: 16
nanobody_basin_top_core_weight: 2
nanobody_basin_exploration_residues_per_position: 6
nanobody_maximum_exhaustive_singles: 32768

# Measured operating point: 1,600 one-shot screens in tranches of 200, then a
# 60-candidate shortlist re-observed ten times, is about 2,140 observations and
# fits the 3,672-second scoring window with the commitment reserve intact.
# Tranches of 200 give each of ten shards twenty sequences, which is what
# amortises the scorer's model load; smaller tranches spend the speedup on
# process startup.
nanobody_candidate_limit: 1600
nanobody_screen_tranche_size: 200
nanobody_weak_initial_fallback_after: 400
nanobody_finalists: 60
nanobody_qualification_observations: 10

# One observation of a fixed sequence lands within about 34 leaderboard rank
# points of its own mean, so a shortlist of five chosen on single observations
# is mostly choosing noise.  Overlapping the per-tranche ranking and database
# update with the next tranche's folding pays for several extra replication
# rounds.
nanobody_pipeline_depth: 1

# Scores depend on which candidates share one BoltzGen predict call.  The live
# 20-candidate tranche implies two per call; keep that grouping when the tranche
# grows to 200 rather than letting it become twenty.
nanobody_screen_predict_batch_size: 2
