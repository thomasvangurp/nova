# Dormant profile for the validated ~28x exact scorer.
#
# Keep activation false until the gates in
# nanobody_opt/RD_BUDGET_ALLOCATION_2026-09-11.md pass on the box.  The shape
# below is not "ten times the old profile": the measured limit on published
# score is selection accuracy, not candidate count, so most of the added
# throughput buys independent observations of a shortlist rather than more
# one-shot candidates.
nanobody_producer_activate: false
# The fast scorer spells two contract flags differently, so it is driven
# through the adapter rather than invoked directly.  Rollback is this one path.
#
# The scorer the adapter drives is no longer something built on the box: it is
# deployed from external_tools/fast_nanobody_scorer/ with its sha256 pin
# re-verified on arrival, and /root/artifacts/nanobody_fast_scorer.json is
# rendered by ansible/nanobody.yml.  Nothing below changed for that.
nanobody_exact_scorer: /root/nanobody_opt/score_boltzgen_fast_adapter.py

# Proposal generation is deliberately UNCHANGED from the configuration that
# produced rank 3 and rank 4.  Widening it to 40 cores and 256 parents diluted
# the pool with weak basins: epoch 25059's replicated finalists came back with
# p90 rank sums of 199, 225 and 252 against a 90 ceiling, and competitive rates
# of 0.14, 0.13 and 0.04 against 0.75.  Held-out replay already showed the
# winner's core sits in the top five, so breadth across cores buys nothing and
# costs pool quality.  The throughput is spent screening MORE of the same good
# neighbourhoods, not wider ones.
# 64 parents carried three clonotypes while the score bank holds nine among its
# best eight hundred by score. Parents are proposal centres and are never
# submitted, so reaching deeper costs ranking and nothing else; the weighted
# seed allocation keeps the leading family's share regardless.
#
# This file is passed with -e, so it OVERRIDES the play defaults in
# nanobody.yml. Changing the value there alone does nothing.
nanobody_parent_limit: 400
nanobody_neighbor_parent_limit: 128
nanobody_recent_anchor_parent_limit: 16
nanobody_recent_neighbor_parent_limit: 16
nanobody_basin_core_limit: 5
nanobody_basin_parent_limit: 32
nanobody_neighbor_seed_count: 32
nanobody_proposals_per_seed: 12
nanobody_proposal_limit: 5000
nanobody_basin_fraction: 0.7
nanobody_basin_routes_per_core: 192
nanobody_basin_evidence_fraction: 0.4
nanobody_basin_evidence_core_limit: 1
nanobody_basin_top_core_weight: 2
nanobody_basin_exploration_residues_per_position: 5

# One pass over the whole filtered shell, then every remaining second on
# replication.  At 0.623 seconds per observation a 2,800-candidate pass is about
# 32 minutes of the 61-minute window, leaving room for roughly 22 rounds over a
# 60-candidate shortlist -- 23 independent observations each.
#
# Simulation says the shortlist/depth split barely matters between 40 and 150,
# so this is sized for a comfortable margin rather than a knife edge.  What does
# matter is that the shell is covered once: a candidate never screened cannot be
# replicated, and a winner outside the shell cannot be proposed at all.
nanobody_candidate_limit: 2800
nanobody_screen_tranche_size: 700
nanobody_weak_initial_fallback_after: 1400
nanobody_finalists: 300
nanobody_qualification_observations: 13

# Replication is spent once per epoch, in the generation that opens inside the
# closing window, over the pooled best of every generation.  The generator does
# not re-propose what it has already screened, so without pooling a strong hit
# from generation one could never be confirmed later.
# Measured, not guessed: replaying 46 molecules 20 times each, our screen's
# agreement with the validator went 0.105 (k=1) -> 0.146 (k=2) -> 0.194 (k=4)
# and then FLAT at 0.194 for k=8.  Four observations reaches the ceiling our
# scorer has (implied validity r~0.21 from a pass-to-pass reliability of 0.246);
# rounds beyond that spend GPU to re-measure something already resolved.
#
# It is also what makes replication affordable at all: 4 rounds over a
# ~77-molecule shortlist is 308 folds (~6 GPU-s each, ~77 blocks on two GPUs),
# inside the 152-block replication reserve, where 12 rounds was not.
nanobody_replication_rounds: 4

# Twelve rounds over sixty candidates is about 1,130 seconds of GPU work (54
# seconds of folding plus one model load each), so screening must stop roughly
# 95 blocks before the commitment reserve.  Without this, a long screen consumes
# the epoch and every candidate is published on a single observation -- the
# exact failure the shortlist exists to prevent.
# Twelve rounds over sixty candidates is 76 blocks of GPU work, and the closing
# generation pays proposal generation and IgBLAST first.  Reserve 104 blocks so
# it can actually finish thirteen observations per finalist -- strict
# qualification needs eight, and a closing window that falls short publishes
# nothing at all, which is how epochs 25056-25058 went unscored.
nanobody_replication_reserve_blocks: 152

# Successive elimination, with depth cut because the returns are concentrated in
# the first few observations.  Measured on 46 real field molecules with three
# independent observations each: predicting a held-out observation of the
# validator's own selection objective (0.8*design_to_target_iptm + 0.2*design_ptm)
# improves r 0.164 -> 0.298 from ONE extra observation.  Past a handful the curve
# flattens, so 24 rounds was well past diminishing returns.
#
# The freed budget widens the tournament instead, which is what matters: the
# epoch-25062 winner drew 85 rank points better than its own average and sits
# 13th of 46 on true quality, so winning is decided by the largest upward
# fluctuation, and a wider field of contenders holds more tickets.
#
# The screen is stage zero -- 2,800 candidates with one observation each -- and
# the tournament starts from the best 300, pruning to 60% every four rounds.  Simulated against the same
# time budget, a flat 60-candidate allocation wins 29% of the time and this wins
# 46%: pruning is cheap, so the budget buys a far wider tournament, and a wider
# tournament is much more likely to contain a candidate that can actually win.
#
# Stages compound, so the surviving candidate accumulates 9 or more observations
# and still clears strict qualification even though pruned candidates do not.
# One stage: with rounds == rounds_per_stage there is nothing to prune between,
# and every shortlisted candidate gets the same four observations.  Staging
# existed to give a survivor 9+ observations, which the k=4 plateau says is
# wasted.
nanobody_replication_rounds_per_stage: 4

# Shortlist sizing solves for (minimum_publishable_observations - 1) rounds, so
# leaving this at its default of 8 budgets seven rounds we no longer run and
# narrows the shortlist for no reason.  One screen pass plus four replication
# rounds is five.
nanobody_minimum_publishable_observations: 5
nanobody_replication_keep_fraction: 0.6

# Full TNP costs about 21 CPU-seconds per uncached sequence: 2,400 novel
# candidates would be far more than an epoch.  Screen the pool on IgBLAST (42 ms/seq at batch one, 21 ms at
# batch eight) and spend full TNP only on the replication shortlist, which the
# race gates before anything can be published.
# Generation one scouts across forty cores; generations two onward concentrate
# on the five that this epoch's own observations rank best.  Held-out replay put
# the eventual winner's core in the top five in 6/6 epochs, and we lose inside
# the core rather than between cores -- same masked core as the winner in three
# epochs, and our terminal variant ranked 6/10, 4/11 and 6/10 within it.
# Measured over 18 epochs, the actual winner sits within Hamming distance one of
# a previously published sequence in 11 of them, and within distance two in 17.
# A strict distance-one shell would therefore cap the ceiling at 61%; distance
# two reaches 94%.  The filter sorts by distance and keeps the closest first, so
# the distance-one shell is consumed before any distance-two proposal is, and
# the wider cutoff only spends capacity that would otherwise go to proposals
# further out than any winner has ever been.
nanobody_public_neighbourhood_distance: 2

nanobody_scout_iterations: 1
nanobody_exploit_basin_fraction: 0.95
nanobody_exploit_basin_core_limit: 5

nanobody_layer2_igblast_only: true
nanobody_igblast_batch_size: 8

# One observation of a fixed sequence lands within about 34 leaderboard rank
# points of its own mean, so a shortlist of five chosen on single observations
# is mostly choosing noise.  Overlapping the per-tranche ranking and database
# update with the next tranche's folding pays for several extra replication
# rounds.
nanobody_pipeline_depth: 1

# With resident models the chunk no longer amortises a model load, so this is
# only work-directory size and failure blast radius.  Keep it small and fixed so
# a larger tranche cannot change how candidates are grouped.
nanobody_screen_predict_batch_size: 2

# Strict qualification thresholds are calibrated against the production
# scorer's observations.  Point this at re-derived thresholds before activating
# a replacement scorer; do not inherit the production values.
nanobody_strict_gates: ""

# Multi-worker packing measured 1.21x for triple the memory, so the wave layer
# stays at one shard per GPU; there is deliberately no knob for it.
