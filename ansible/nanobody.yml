---
# Dedicated NOVA nanobody design/scoring host. BoltzGen and MetaNano require
# different Python/PyTorch stacks, so both are declared as isolated Pixi
# environments and installed strictly from the committed lockfile.
#
# The host is discovered from `vastai show instances --raw` by label, never
# written down: see ansible/inventory/vast_nanobody.py. `hosts:` is the
# discovered group and not `all`, because `all` now also contains the
# operator's own machine (the slot_manager group), which must never be
# provisioned as a GPU box.
- ansible.builtin.import_playbook: require_producer.yml

- name: Provision the nanobody design and scoring box
  hosts: nanobody_producer
  remote_user: root
  gather_facts: false
  any_errors_fatal: true
  vars:
    repo: "{{ playbook_dir }}/.."
    validator_config_url: >-
      https://raw.githubusercontent.com/metanova-labs/nova/main/config/config.yaml
    validator_boltzgen_config_url: >-
      https://raw.githubusercontent.com/metanova-labs/nova/main/config/boltzgen_config.yaml
    pixi_version: "0.73.0"
    pixi_archive: /root/.cache/pixi-{{ pixi_version }}-linux.tar.gz
    pixi_url: >-
      https://github.com/prefix-dev/pixi/releases/download/v{{ pixi_version }}/pixi-x86_64-unknown-linux-musl.tar.gz
    pixi_sha256: 682564e7cd35d38307df3cd6c8e9a45a1437d20febac0c8d165809d7c38408d1
    nanobody_producer_activate: false
    nanobody_producer_session: nova-nanobody-producer
    nanobody_mutation_database: /root/artifacts/nanobody_mutations.sqlite
    nanobody_backfill_exact_screens: false
    nanobody_parent_epochs: 0
    nanobody_parent_limit: 64
    nanobody_neighbor_parent_limit: 32
    nanobody_recent_parent_epoch_window: 16
    nanobody_recent_anchor_parent_limit: 16
    nanobody_recent_neighbor_parent_limit: 16
    nanobody_basin_core_limit: 5
    nanobody_basin_parent_limit: 32
    nanobody_neighbor_seed_count: 32
    nanobody_proposals_per_seed: 12
    nanobody_proposal_limit: 384
    nanobody_basin_fraction: 0.70
    nanobody_basin_routes_per_core: 192
    nanobody_basin_evidence_fraction: 0.40
    nanobody_basin_evidence_core_limit: 1
    nanobody_basin_top_core_weight: 2
    nanobody_basin_exploration_residues_per_position: 5
    nanobody_maximum_exhaustive_singles: 8192
    nanobody_candidate_limit: 320
    nanobody_screen_tranche_size: 20
    nanobody_maximum_initial_screen_p90: 90
    nanobody_weak_initial_fallback_after: 80
    nanobody_finalists: 5
    nanobody_exact_scorer: /root/nanobody_opt/score_boltzgen_batch.py
    nanobody_basin_shrinkage_strength: 2.0
    nanobody_minimum_basin_samples: 3
    nanobody_qualification_observations: 8
    nanobody_pipeline_depth: 1
    nanobody_replication_rounds: 0
    nanobody_replication_reserve_blocks: 0
    nanobody_replication_rounds_per_stage: 0
    nanobody_replication_keep_fraction: 1.0
    nanobody_layer2_igblast_only: false
    nanobody_public_neighbourhood_distance: 0
    nanobody_scout_iterations: 1
    nanobody_exploit_basin_fraction: 0.95
    nanobody_exploit_basin_core_limit: 5
    nanobody_igblast_batch_size: 8
    nanobody_strict_gates: ""
    nanobody_screen_predict_batch_size: 0
    # The vendored ~28x exact scorer, deployed from external_tools/ rather than
    # built on the box. It lived only on rented hardware for four days and
    # survived its instance being destroyed by minutes; see
    # external_tools/fast_nanobody_scorer/PROVENANCE.md.
    #
    # The directory is named after the pinned digest, so an unpinned or
    # differently pinned build cannot quietly occupy the same path, and the
    # adapter's own sha256 check refuses anything but these bytes.
    nanobody_fast_scorer_sha256: >-
      530f5dcbc54d4a012571f4f9a7ddb6c016552291606652766d02c91643a7d531
    nanobody_fast_scorer_root: /root/fastscore
    nanobody_fast_scorer_reference: >-
      0000e1b3814df2814ccd415e06b26f32204cc45753777f284216e0243098d916_P20809_input.cif
    nanobody_fast_scorer_tuning: {}
    ckpts:
      - name: boltzgen1_diverse.ckpt
        sha256: 360af8bd6e59527ff6ec25dd81253967f3bd3567d200053b10680634751f8e3c
      - name: boltzgen1_adherence.ckpt
        sha256: ac7078b3dc13064c68e0c3fd542e5bc538c33558bf6607f65e499eb336ca5e5d
      - name: boltzgen1_ifold.ckpt
        sha256: dd4cf108c94471bdc3a326b7b180fa3854dc019110fae780208c30b50bd56578
      - name: boltz2_conf_final.ckpt
        sha256: 525a51ef306da7282a54d23a4a5b91212fc60d0ff6b23b56dd6351de3b387530

  tasks:
    - name: Require committed deployment source
      ansible.builtin.command:
        argv: [git, -C, "{{ repo }}", status, --porcelain, --untracked-files=all]
      delegate_to: localhost
      vars:
        ansible_connection: local
      register: controller_status
      changed_when: false
      failed_when: controller_status.stdout | length > 0

    - name: Resolve committed deployment revision
      ansible.builtin.command:
        argv: [git, -C, "{{ repo }}", rev-parse, HEAD]
      delegate_to: localhost
      vars:
        ansible_connection: local
      register: controller_revision
      changed_when: false

    - name: Count effective CPUs
      ansible.builtin.shell: |
        if [ -f /sys/fs/cgroup/cpu.max ]; then
          read -r q p < /sys/fs/cgroup/cpu.max
          [ "$q" = max ] && nproc || echo $(( q / p ))
        else
          q=$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)
          p=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)
          [ "$q" -le 0 ] && nproc || echo $(( q / p ))
        fi
      args:
        executable: /bin/bash
      changed_when: false
      register: cpus

    - name: Create runtime destinations and persistent caches
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /root/.cache
        - /root/.cache/triton-bgen
        - /root/.cache/matplotlib
        - /root/.nv/ComputeCache
        - /root/.boltzgen
        - /root/config
        - /root/data/msa_files
        - /root/data/structures
        - /root/external_tools/boltzgen
        - /root/external_tools/NOVA-nanobody-filter
        - /root/external_tools/igblast/bin
        - /root/external_tools/igblast/database
        - /root/external_tools/igblast/internal_data
        - /root/metanano_shim
        - /root/nanobody_opt
        - /root/layer2_cache
        - /root/live
        - /root/artifacts

    - name: Fetch the live validator configuration
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ item.dest }}"
        mode: "0644"
        force: true
      loop:
        - url: "{{ validator_config_url }}"
          dest: /root/config/config.yaml
        - url: "{{ validator_boltzgen_config_url }}"
          dest: /root/config/boltzgen_config.yaml

    - name: Read the live validator configuration
      ansible.builtin.slurp:
        src: /root/config/config.yaml
      register: validator_config_file

    - name: Parse the live validator configuration
      ansible.builtin.set_fact:
        validator_config: "{{ validator_config_file.content | b64decode | from_yaml }}"

    - name: Resolve the live nanobody challenge
      ansible.builtin.set_fact:
        nanobody_target: "{{ validator_config.protein_selection.nanobody.target }}"
        nanobody_structure: "{{ validator_config.protein_selection.nanobody.structure }}"

    - name: Require a single fully specified live nanobody challenge
      ansible.builtin.assert:
        that:
          - nanobody_target | length > 0
          - "',' not in nanobody_target"
          - nanobody_structure | length > 0
        fail_msg: >-
          The live validator config does not describe one supported nanobody target.
        success_msg: >-
          Live nanobody challenge is {{ nanobody_target }} / {{ nanobody_structure }}.

    - name: Reject a host with unusable real download bandwidth
      ansible.builtin.shell: |
        start=$(date +%s)
        curl -fsSL -o /dev/null --max-time 60 \
          https://huggingface.co/datasets/Metanova/Submission-Archive/resolve/main/{{ nanobody_target }}_nanobodies.csv
        echo $(( $(date +%s) - start ))
      args:
        executable: /bin/bash
      changed_when: false
      register: probe

    - name: Report host preflight
      ansible.builtin.assert:
        that: probe.stdout | int <= 30
        fail_msg: "Archive download took {{ probe.stdout }} seconds; replace this host"
        success_msg: "{{ cpus.stdout }} CPUs; archive in {{ probe.stdout }} seconds"

    - name: Ship the declarative Pixi manifest and lockfile
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/root/{{ item | basename }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - "{{ repo }}/pixi.toml"
        - "{{ repo }}/pixi.lock"

    - name: Sync the pinned vendored BoltzGen source
      ansible.posix.synchronize:
        src: "{{ repo }}/external_tools/boltzgen/"
        dest: /root/external_tools/boltzgen/
        checksum: true
        owner: false
        group: false
        rsync_opts: ["--exclude=__pycache__", "--exclude=*.pyc", "--no-perms"]
        use_ssh_args: true

    - name: Sync the pinned NOVA-nanobody-filter submodule
      ansible.posix.synchronize:
        src: "{{ repo }}/NOVA-nanobody-filter/"
        dest: /root/external_tools/NOVA-nanobody-filter/
        checksum: true
        owner: false
        group: false
        rsync_opts: ["--exclude=.git", "--exclude=__pycache__", "--exclude=*.pyc", "--no-perms"]
        use_ssh_args: true

    # One runtime root. See ansible/tasks/sync_repo.yml for why there is exactly
    # one, and what a second one cost.
    - name: Sync the committed runtime into the single root
      ansible.builtin.include_tasks: tasks/sync_repo.yml

    - name: Remove the second runtime root that deployed from another branch
      ansible.builtin.file:
        path: /root/nova-standalone
        state: absent

    - name: Create the pinned fast-scorer destination
      ansible.builtin.file:
        path: "{{ nanobody_fast_scorer_root }}/pinned-{{ nanobody_fast_scorer_sha256[:12] }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the vendored fast exact scorer from version control
      ansible.posix.synchronize:
        src: "{{ repo }}/external_tools/fast_nanobody_scorer/"
        dest: "{{ nanobody_fast_scorer_root }}/pinned-{{ nanobody_fast_scorer_sha256[:12] }}/"
        checksum: true
        owner: false
        group: false
        perms: false
        rsync_opts:
          - "--omit-dir-times"
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
          - "--no-perms"
        use_ssh_args: true

    - name: Restore the executable bit on the scorer launcher
      ansible.builtin.file:
        path: "{{ nanobody_fast_scorer_root }}/pinned-{{ nanobody_fast_scorer_sha256[:12] }}/release_python.sh"
        mode: "0755"

    # release_python.sh sets PYTHONPATH to /root/fastscore/release/boltzgen_src.
    # That path was a working directory on the destroyed box and is not in
    # version control, so the committed launcher would import the live vendored
    # BoltzGen instead of its own pinned copy -- silently, and only under load.
    # The link makes the committed launcher correct as committed, and keeps
    # "release" pointing at whichever digest is deployed.
    - name: Point the launcher's PYTHONPATH at the deployed pinned tree
      ansible.builtin.file:
        src: "{{ nanobody_fast_scorer_root }}/pinned-{{ nanobody_fast_scorer_sha256[:12] }}"
        dest: "{{ nanobody_fast_scorer_root }}/release"
        state: link
        force: true

    - name: Verify the deployed scorer is byte-identical to the validated one
      ansible.builtin.stat:
        path: "{{ nanobody_fast_scorer_root }}/pinned-{{ nanobody_fast_scorer_sha256[:12] }}/fast_score_batch.py"
        checksum_algorithm: sha256
      register: deployed_fast_scorer

    - name: Assert the fast scorer pin survived the transfer
      ansible.builtin.assert:
        that:
          - deployed_fast_scorer.stat.exists
          - deployed_fast_scorer.stat.checksum == nanobody_fast_scorer_sha256
        fail_msg: >-
          The deployed fast scorer hashes
          {{ deployed_fast_scorer.stat.checksum | default('(absent)') }}, not the
          pinned {{ nanobody_fast_scorer_sha256 }}. score_boltzgen_fast_adapter
          would refuse it mid-epoch; fix the transfer or update the pin
          deliberately.
        success_msg: "Fast scorer pinned at {{ nanobody_fast_scorer_sha256[:12] }}."

    - name: Verify the reference design the adapter grafts against
      ansible.builtin.stat:
        path: "{{ nanobody_fast_scorer_root }}/pinned-{{ nanobody_fast_scorer_sha256[:12] }}/refdesign/{{ nanobody_fast_scorer_reference }}"
      register: deployed_synth_reference

    - name: Require the reference design before naming it in the settings
      ansible.builtin.assert:
        that:
          - deployed_synth_reference.stat.exists
          - deployed_synth_reference.stat.size > 1000
        fail_msg: >-
          synth_reference {{ nanobody_fast_scorer_reference }} is missing from the
          deployed package. Without it the adapter silently falls back to the
          slow diffusion design stage, which is correct but is not the 28x path.

    # Box-specific tuning stays out of the repository, but the file itself is
    # rendered here so the pin, the launcher and the reference design cannot
    # drift apart between the deployment and the adapter that reads them.
    # nanobody_fast_scorer_tuning carries any per-host knobs the adapter
    # forwards (fold_sampling_steps, fold_diffusion_samples, ...); it is empty by
    # default so the scorer runs with the settings it was validated under.
    - name: Render the adapter's scorer settings with the pin intact
      ansible.builtin.copy:
        dest: /root/artifacts/nanobody_fast_scorer.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {{
            {
              'python': nanobody_fast_scorer_root ~ '/pinned-' ~ nanobody_fast_scorer_sha256[:12] ~ '/release_python.sh',
              'scorer': nanobody_fast_scorer_root ~ '/pinned-' ~ nanobody_fast_scorer_sha256[:12] ~ '/fast_score_batch.py',
              'scorer_sha256': nanobody_fast_scorer_sha256,
              'synth_reference': nanobody_fast_scorer_root ~ '/pinned-' ~ nanobody_fast_scorer_sha256[:12] ~ '/refdesign/' ~ nanobody_fast_scorer_reference,
            } | combine(nanobody_fast_scorer_tuning) | to_nice_json
          }}

    - name: Install interpreter wrappers and scorer shims
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/files/root/"
        dest: /root/
        checksum: true
        owner: false
        group: false
        rsync_opts: ["--exclude=__pycache__", "--exclude=*.pyc", "--no-perms"]
        use_ssh_args: true

    - name: Install the MetaNano bittensor logging shim outside site-packages
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/metanano/bittensor.py"
        dest: /root/metanano_shim/bittensor.py
        owner: root
        group: root
        mode: "0644"

    - name: Restore executable bits on wrappers
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0755"
      loop:
        - /root/bgen_python.sh
        - /root/metanano_python.sh
        - /root/metanano_shim/bin/TNP

    - name: Sync the MSA at the path BoltzGen constructs
      ansible.posix.synchronize:
        src: "{{ repo }}/data/msa_files/{{ nanobody_target }}.a3m"
        dest: "/root/data/msa_files/{{ nanobody_target }}.a3m"
        owner: false
        group: false

    - name: Sync NOVA's pinned IgBLAST germline databases
      ansible.posix.synchronize:
        src: "{{ repo }}/data/igblast_database/database/"
        dest: /root/external_tools/igblast/database/
        checksum: true
        owner: false
        group: false
        rsync_opts: ["--no-perms"]

    - name: Sync NOVA's custom camelid IgBLAST internal data
      ansible.posix.synchronize:
        src: "{{ repo }}/data/igblast_internal_data/camelid/"
        dest: /root/external_tools/igblast/internal_data/camelid/
        checksum: true
        owner: false
        group: false
        rsync_opts: ["--no-perms"]

    - name: Download the target structure
      ansible.builtin.get_url:
        url: "https://files.rcsb.org/download/{{ nanobody_structure }}.cif"
        dest: "/root/data/structures/{{ nanobody_structure }}.cif"
        mode: "0644"

    - name: Fetch the target submission archive
      ansible.builtin.get_url:
        url: >-
          https://huggingface.co/datasets/Metanova/Submission-Archive/resolve/main/{{ nanobody_target }}_nanobodies.csv
        dest: "/root/{{ nanobody_target }}_nanobodies.csv"
        mode: "0644"

    - name: Download the pinned Pixi binary archive
      ansible.builtin.get_url:
        url: "{{ pixi_url }}"
        dest: "{{ pixi_archive }}"
        checksum: "sha256:{{ pixi_sha256 }}"
        mode: "0644"

    - name: Install the pinned Pixi binary
      ansible.builtin.unarchive:
        src: "{{ pixi_archive }}"
        dest: /usr/local/bin
        remote_src: true
        creates: /usr/local/bin/pixi

    - name: Verify the exact Pixi version
      ansible.builtin.command: /usr/local/bin/pixi --version
      changed_when: false
      register: pixi_check
      failed_when: "('pixi ' ~ pixi_version) not in pixi_check.stdout"

    - name: Install the locked BoltzGen CUDA environment
      ansible.builtin.command:
        argv:
          - /usr/local/bin/pixi
          - install
          - --manifest-path
          - /root/pixi.toml
          - --locked
          - --environment
          - bgen
      environment:
        PIXI_COLOR: never
      register: bgen_build
      changed_when: "'Nothing to do' not in (bgen_build.stdout ~ bgen_build.stderr)"

    # Hugging Face's Xet client moved a 1.9 GB checkpoint in 20 seconds on the
    # same host where a raw LFS curl transferred only ~1 MB/s. Start the locked
    # client after bgen exists, then overlap it with MetaNano setup and canaries.
    - name: Start Xet-accelerated checksum-verified checkpoint download
      ansible.builtin.command:
        argv:
          - /root/bgen_python.sh
          - /root/nanobody_opt/fetch_checkpoints.py
          - --local-dir
          - /root/.boltzgen
          - --specs-json
          - "{{ ckpts | to_json }}"
      environment:
        HF_XET_HIGH_PERFORMANCE: "1"
      async: 1800
      poll: 0
      changed_when: true
      register: checkpoint_job

    - name: Install the locked MetaNano and IgBLAST environment
      ansible.builtin.command:
        argv:
          - /usr/local/bin/pixi
          - install
          - --manifest-path
          - /root/pixi.toml
          - --locked
          - --environment
          - metanano
      environment:
        PIXI_COLOR: never
      register: metanano_build
      changed_when: "'Nothing to do' not in (metanano_build.stdout ~ metanano_build.stderr)"

    - name: Verify Pixi activation owns the Layer-2 runtime
      ansible.builtin.command:
        argv:
          - /usr/local/bin/pixi
          - run
          - --manifest-path
          - /root/pixi.toml
          - --environment
          - metanano
          - python
          - -c
          - >-
            import os,shutil,metanano;
            assert os.environ['IGDATA']=='/root/external_tools/igblast';
            assert all(os.environ[k]=='1' for k in
            ('OMP_NUM_THREADS','MKL_NUM_THREADS','OPENBLAS_NUM_THREADS','NUMEXPR_NUM_THREADS'));
            assert shutil.which('TNP')=='/root/metanano_shim/bin/TNP',shutil.which('TNP');
            print('METANANO_PIXI_ACTIVATION_OK')
      changed_when: false

    - name: Locate Pixi's built-in human IgBLAST internal data
      ansible.builtin.shell: |
        find /root/.pixi/envs/metanano -type d -path '*/internal_data/human' -print -quit
      args:
        executable: /bin/bash
      changed_when: false
      register: human_igdata
      failed_when: not human_igdata.stdout

    - name: Expose Pixi's IgBLAST binary at MetaNano's fixed path
      ansible.builtin.file:
        src: /root/.pixi/envs/metanano/bin/igblastp
        dest: /root/external_tools/igblast/bin/igblastp
        state: link
        force: true

    - name: Expose Pixi's human IgBLAST internal data beside camelid data
      ansible.builtin.file:
        src: "{{ human_igdata.stdout }}"
        dest: /root/external_tools/igblast/internal_data/human
        state: link
        force: true

    - name: Find the Pixi-installed TNP patch target
      ansible.builtin.shell: |
        find /root/.pixi/envs/metanano/lib -path '*/site-packages/scripts/process_pdb.py' -print -quit
      args:
        executable: /bin/bash
      changed_when: false
      register: tnp_patch_target
      failed_when: not tnp_patch_target.stdout

    - name: Apply upstream's Biopython compatibility patch to locked TNP
      ansible.builtin.copy:
        src: /root/external_tools/NOVA-nanobody-filter/install/patches/TNP/process_pdb.py
        dest: "{{ tnp_patch_target.stdout }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    - name: Locate the Pixi-installed ImmuneBuilder refinement module
      ansible.builtin.shell: |
        find /root/.pixi/envs/metanano/lib -path '*/site-packages/ImmuneBuilder/refine.py' -print -quit
      args:
        executable: /bin/bash
      changed_when: false
      register: immunebuilder_refine
      failed_when: not immunebuilder_refine.stdout

    # ImmuneBuilder's strained-sidechain path passes a set to OpenMM where its
    # API requires a property dictionary. Ordinary structures never enter this
    # branch, so retain the pinned revision and apply the one-character fix.
    - name: Apply the OpenMM property-map fix to locked ImmuneBuilder
      ansible.builtin.replace:
        path: "{{ immunebuilder_refine.stdout }}"
        regexp: >-
          \{'Threads', str\(n_threads\)\}
        replace: "{'Threads': str(n_threads)}"

    - name: Verify the ImmuneBuilder OpenMM fix is present
      ansible.builtin.command:
        argv:
          - /root/metanano_python.sh
          - -c
          - >-
            import inspect,ImmuneBuilder.refine as r;
            s=inspect.getsource(r.strained_sidechain_bonds_fixer);
            assert "{'Threads': str(n_threads)}" in s,s;
            assert "{'Threads', str(n_threads)}" not in s,s;
            print('IMMUNEBUILDER_OPENMM_PATCH_OK')
      changed_when: false

    - name: Assert the wrapper rejects an inherited cross-environment PYTHONPATH
      ansible.builtin.command: >-
        /root/bgen_python.sh -c
        "import numpy; assert numpy.__version__ == '2.0.2'; print(numpy.__version__)"
      environment:
        PYTHONPATH: /root/.pixi/envs/metanano/lib/python3.12/site-packages
      changed_when: false

    - name: Verify BoltzGen imports and sees every rented GPU
      ansible.builtin.command: >-
        /root/bgen_python.sh -c
        "import os,sys,torch,boltzgen; from triton.runtime import driver;
        assert torch.cuda.is_available();
        assert sys.version_info[:2]==(3,12),sys.version;
        assert torch.__version__=='2.7.1+cu126',torch.__version__;
        assert torch.version.cuda=='12.6',torch.version.cuda;
        assert all(os.environ.get(k)=='1' for k in
        ('OMP_NUM_THREADS','MKL_NUM_THREADS','OPENBLAS_NUM_THREADS',
        'NUMEXPR_NUM_THREADS'));
        print('BOLTZGEN_OK', torch.__version__, torch.cuda.device_count(),
        driver.active.get_current_device())"
      changed_when: false
      register: bgen_check
      failed_when: "'BOLTZGEN_OK' not in bgen_check.stdout"

    - name: Assert the live BoltzGen protocol has ten ranked metrics
      ansible.builtin.command:
        argv:
          - /root/bgen_python.sh
          - -c
          - >-
            import yaml;
            c=yaml.safe_load(open('/root/config/boltzgen_config.yaml'));
            m=[k for d in c['metrics'].values() for k in d];
            assert c['protocol']=='nanobody-anything',c['protocol'];
            assert len(m)==10,m;
            print('PROTOCOL_OK',len(m))
      changed_when: false

    - name: Assert validator dual-sample selection is explicit
      ansible.builtin.command:
        argv:
          - /root/bgen_python.sh
          - -c
          - >-
            import inspect,numpy as np;
            from boltzgen.task.predict.writer import FoldingWriter;
            from nanobody_opt.diffusion_sample_selection import
            SCORER_PROTOCOL,select_diffusion_samples;
            x=select_diffusion_samples({'iptm':np.array([.9,.5]),
            'ptm':np.array([.9,.5]),
            'design_to_target_iptm':np.array([.4,.9]),
            'design_ptm':np.array([.4,.9])});
            assert SCORER_PROTOCOL=='validator-dual-sample-v1';
            assert x.writer_sample_index==0 and x.analyze_sample_index==1,x;
            assert 'refold_analyze_cif' in inspect.getsource(FoldingWriter),x;
            print('DUAL_SAMPLE_PROTOCOL_OK')
      changed_when: false

    - name: Compile autonomous producer and structure-stability modules
      ansible.builtin.command:
        argv:
          - /root/bgen_python.sh
          - -m
          - py_compile
          - /root/nanobody_opt/diffusion_sample_selection.py
          - /root/nanobody_opt/pose_stability.py
          - /root/nanobody_opt/basins.py
          - /root/nanobody_opt/local_neighborhood.py
          - /root/nanobody_opt/terminal_policy.py
          - /root/nanobody_opt/sequential_exact_race.py
          - /root/nanobody_opt/run_live_producer.py
          - /root/nanobody_opt/select_elite_parents.py
          - /root/nanobody_opt/mutation_network.py
          - /root/nanobody_opt/seed_mutation_database.py
          - /root/nanobody_opt/import_exact_screens.py
          - /root/nanobody_opt/rank_exact.py
          - /root/nanobody_opt/score_boltzgen_batch.py
          - /root/nanobody_opt/score_boltzgen_waves.py
          # The publication path. score_boltzgen_fast_adapter is here because a
          # refactor left it raising ModuleNotFoundError and only the deploy
          # gates caught it; publication_gates and publish_checkpoint are here
          # because a relaxed gate that does not import is a gate that never
          # relaxed.
          - /root/nanobody_opt/score_boltzgen_fast_adapter.py
          - /root/nanobody_opt/publication_gates.py
          - /root/nanobody_opt/publish_checkpoint.py
          - /root/nanobody_opt/win_probability.py
          - /root/nanobody_opt/qualify_screen_leader.py
      changed_when: false

    - name: Verify autonomous producer entry points use the locked Pixi runtime
      ansible.builtin.command:
        argv:
          - /usr/local/bin/pixi
          - run
          - --manifest-path
          - /root/pixi.toml
          - --environment
          - bgen
          - sequential-exact-race
          - --
          - --help
      environment:
        PIXI_COLOR: never
      changed_when: false

    - name: Verify exact-screen importer uses the locked Pixi runtime
      ansible.builtin.command:
        argv:
          - /usr/local/bin/pixi
          - run
          - --manifest-path
          - /root/pixi.toml
          - --locked
          - --environment
          - bgen
          - import-exact-screens
          - --
          - --help
      environment:
        PIXI_COLOR: never
      changed_when: false

    - name: Backfill every preserved exact screen through locked Pixi
      ansible.builtin.command:
        argv:
          - /usr/local/bin/pixi
          - run
          - --manifest-path
          - /root/pixi.toml
          - --locked
          - --environment
          - bgen
          - import-exact-screens
          - --
          - --database
          - "{{ nanobody_mutation_database }}"
          - --target
          - "{{ nanobody_target }}"
          - --archive
          - "/root/{{ nanobody_target }}_nanobodies.csv"
          - --exact-root
          - /root/live
          - --exact-root
          - /root/design
          - --exact-root
          - /root/artifacts/rd/validator_parity
          - --exact-root
          - /root/local_neighborhood_round1_exact.json
          - --exact-root
          - /root/recombinants_cdr_probe2_exact.json
          - --metadata-root
          - /root/live
          - --metadata-root
          - /root/design
          - --rebuild-edges
          - --edge-workers
          - "{{ [cpus.stdout | int, 40] | min }}"
      environment:
        PIXI_COLOR: never
      register: exact_screen_backfill
      changed_when: true
      when: nanobody_backfill_exact_screens | bool

    - name: Report exact-screen backfill
      ansible.builtin.debug:
        var: exact_screen_backfill.stdout
      when: nanobody_backfill_exact_screens | bool

    - name: Assert every external Layer-2 executable and database exists
      ansible.builtin.shell: |
        set -eu
        test -x /root/.pixi/envs/metanano/bin/igblastp
        test -x /root/.pixi/envs/metanano/bin/TNP
        test -x /root/.pixi/envs/metanano/bin/NanoBodyBuilder2
        test -x /root/.pixi/envs/metanano/bin/mkdssp
        test -x /root/.pixi/envs/metanano/bin/psa
        test -s /root/external_tools/igblast/database/camelid_V.psq
        test -s /root/external_tools/igblast/database/human_V.psq
        test -s /root/external_tools/igblast/internal_data/camelid/camelid.pdm.imgt
        echo LAYER2_ARTIFACTS_OK
      args:
        executable: /bin/bash
      changed_when: false
      register: layer2_artifacts

    - name: Prove Layer-2 computes real IgBLAST and TNP results
      ansible.builtin.command:
        argv:
          - /root/metanano_python.sh
          - /root/nanobody_opt/filter_layer2.py
          - --input
          - "/root/{{ nanobody_target }}_nanobodies.csv"
          - --config
          - /root/config/config.yaml
          - --output
          - /root/layer2_canary.json
          - --tail
          - "1"
          - --concurrency
          - "1"
          - --cache-dir
          - /root/layer2_cache
      environment:
        NOVA_MAX_CONCURRENT_TNP: "1"
      changed_when: false
      register: layer2_canary

    - name: Verify the Layer-2 canary is a measured pass
      ansible.builtin.command:
        argv:
          - /root/metanano_python.sh
          - -c
          - >-
            import json;
            x=json.load(open('/root/layer2_canary.json'));
            assert x['input_count']==1,x;
            assert x['pass_count']==1,x;
            c=x['candidates'][0];
            assert c['nativeness_score'] is not None,c;
            assert c['human_framework_score'] is not None,c;
            assert c['developability']['passed'],c;
            print('LAYER2_CANARY_OK')
      changed_when: false

    - name: Reap the Xet checkpoint download
      ansible.builtin.async_status:
        jid: "{{ checkpoint_job.ansible_job_id }}"
      register: checkpoints
      until: checkpoints.finished
      retries: 720
      delay: 10
      changed_when: "'DOWNLOADED=0' not in (checkpoints.stdout | default(''))"
      failed_when: >-
        checkpoints.finished and
        (checkpoints.rc | default(1) != 0 or
         'ALL_CHECKPOINTS_OK' not in (checkpoints.stdout | default('')))

    - name: Verify hardcoded BoltzGen inputs are nonempty
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "/root/data/structures/{{ nanobody_structure }}.cif"
        - "/root/data/msa_files/{{ nanobody_target }}.a3m"
      register: scorer_inputs

    - name: Assert hardcoded BoltzGen inputs landed
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 1000
        fail_msg: "{{ item.item }} is missing or truncated"
      loop: "{{ scorer_inputs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Repair ownership without following external links
      ansible.builtin.shell: |
        set -euo pipefail
        bad=$(find /root -xdev -maxdepth 3 ! -user root -printf '%p\n' 2>/dev/null | head -20)
        if [ -n "$bad" ]; then
          echo "REPAIRED"
          chown -R --no-dereference root:root /root
        fi
        chmod 0700 /root
        stat -c '%U:%G %a /root' /root
      args:
        executable: /bin/bash
      changed_when: "'REPAIRED' in ownership.stdout"
      register: ownership

    # A coldkey on a rented box is an unrecoverable loss, and "it is only the
    # scoring box" is exactly the assumption under which one gets copied there
    # by accident. This runs on every host in every mode, not only where a
    # wallet is expected, and it is the reason the slot purchase agent runs on
    # the operator's own machine instead of here.
    - name: Refuse coldkey material on the rental
      ansible.builtin.find:
        paths: /root/.bittensor/wallets
        patterns: [coldkey]
        recurse: true
        file_type: file
      register: rental_coldkeys

    - name: Assert the rental contains no coldkey
      ansible.builtin.assert:
        that: rental_coldkeys.matched | int == 0
        fail_msg: >-
          Coldkey material found under /root/.bittensor/wallets on rented
          hardware. Remove it and treat it as compromised.
        success_msg: "No coldkey on the rental."

    # ---- Safety gate ------------------------------------------------------
    # Every check between here and "Stop prior autonomous nanobody producer"
    # runs while the existing producer is still mining. A deploy that cannot
    # start the replacement therefore leaves the old one running instead of
    # taking the miner down: that is how an adapter ModuleNotFoundError was
    # caught without costing an epoch, and it is why nothing below reorders.

    - name: Name the producer's launcher and arguments once
      ansible.builtin.set_fact:
        # Declared as data so the same list is both what the gate verifies and
        # what tmux starts. Typing them twice is how a verified flag and a
        # passed flag drift apart.
        nanobody_producer_launcher:
          - /usr/local/bin/pixi
          - run
          - --manifest-path
          - /root/pixi.toml
          - --locked
          - --environment
          - bgen
          - live-producer
          - --
        nanobody_producer_arguments:
          - --poll-interval
          - "30"
          - --mutation-database
          - "{{ nanobody_mutation_database }}"
          - --parent-epochs
          - "{{ nanobody_parent_epochs }}"
          - --parent-limit
          - "{{ nanobody_parent_limit }}"
          - --neighbor-parent-limit
          - "{{ nanobody_neighbor_parent_limit }}"
          - --recent-parent-epoch-window
          - "{{ nanobody_recent_parent_epoch_window }}"
          - --recent-anchor-parent-limit
          - "{{ nanobody_recent_anchor_parent_limit }}"
          - --recent-neighbor-parent-limit
          - "{{ nanobody_recent_neighbor_parent_limit }}"
          - --basin-core-limit
          - "{{ nanobody_basin_core_limit }}"
          - --basin-parent-limit
          - "{{ nanobody_basin_parent_limit }}"
          - --neighbor-seed-count
          - "{{ nanobody_neighbor_seed_count }}"
          - --per-seed
          - "{{ nanobody_proposals_per_seed }}"
          - --proposal-limit
          - "{{ nanobody_proposal_limit }}"
          - --basin-fraction
          - "{{ nanobody_basin_fraction }}"
          - --basin-routes-per-core
          - "{{ nanobody_basin_routes_per_core }}"
          - --basin-evidence-fraction
          - "{{ nanobody_basin_evidence_fraction }}"
          - --basin-evidence-core-limit
          - "{{ nanobody_basin_evidence_core_limit }}"
          - --basin-top-core-weight
          - "{{ nanobody_basin_top_core_weight }}"
          - --basin-exploration-residues-per-position
          - "{{ nanobody_basin_exploration_residues_per_position }}"
          - --maximum-exhaustive-singles
          - "{{ nanobody_maximum_exhaustive_singles }}"
          - --candidate-limit
          - "{{ nanobody_candidate_limit }}"
          - --screen-tranche-size
          - "{{ nanobody_screen_tranche_size }}"
          - --maximum-initial-screen-p90
          - "{{ nanobody_maximum_initial_screen_p90 }}"
          - --weak-initial-fallback-after
          - "{{ nanobody_weak_initial_fallback_after }}"
          - --finalists
          - "{{ nanobody_finalists }}"
          - --exact-scorer
          - "{{ nanobody_exact_scorer }}"
          - --basin-shrinkage-strength
          - "{{ nanobody_basin_shrinkage_strength }}"
          - --minimum-basin-samples
          - "{{ nanobody_minimum_basin_samples }}"
          - --qualification-observations
          - "{{ nanobody_qualification_observations }}"
          - --pipeline-depth
          - "{{ nanobody_pipeline_depth }}"
          - --replication-rounds
          - "{{ nanobody_replication_rounds }}"
          - --replication-reserve-blocks
          - "{{ nanobody_replication_reserve_blocks }}"
          - --replication-rounds-per-stage
          - "{{ nanobody_replication_rounds_per_stage }}"
          - --replication-keep-fraction
          - "{{ nanobody_replication_keep_fraction }}"
          - --igblast-batch-size
          - "{{ nanobody_igblast_batch_size }}"
          # A replacement scorer needs its own calibrated qualification
          # thresholds; an empty value keeps the production scorer's.
          - --strict-gates
          - "{{ nanobody_strict_gates }}"
          - --layer2-igblast-only
          - "{{ 1 if nanobody_layer2_igblast_only | bool else 0 }}"
          - --public-neighbourhood-distance
          - "{{ nanobody_public_neighbourhood_distance }}"
          - --scout-iterations
          - "{{ nanobody_scout_iterations }}"
          - --exploit-basin-fraction
          - "{{ nanobody_exploit_basin_fraction }}"
          - --exploit-basin-core-limit
          - "{{ nanobody_exploit_basin_core_limit }}"
          - --screen-predict-batch-size
          - "{{ nanobody_screen_predict_batch_size }}"

    - name: Check the configured live exact scorer before activation
      ansible.builtin.stat:
        path: "{{ nanobody_exact_scorer }}"
      register: configured_exact_scorer
      when: nanobody_producer_activate | bool

    - name: Require the configured live exact scorer before stopping the producer
      ansible.builtin.assert:
        that:
          - configured_exact_scorer.stat.isreg | default(false)
        fail_msg: >-
          Exact scorer {{ nanobody_exact_scorer }} is absent; the existing live
          producer was not stopped.
      when: nanobody_producer_activate | bool

    # The scorer contract is a fixed argument list that score_boltzgen_waves
    # passes positionally by name. The fast adapter exists because the vendored
    # scorer spells two of them differently, so a scorer that no longer accepts
    # one of these is a scorer every wave will fail on.
    - name: Verify the configured exact scorer starts and keeps its contract
      ansible.builtin.include_tasks: tasks/verify_entrypoint.yml
      vars:
        entrypoint_name: "exact scorer {{ nanobody_exact_scorer | basename }}"
        entrypoint_argv:
          - /root/bgen_python.sh
          - "{{ nanobody_exact_scorer }}"
        entrypoint_flags:
          - --sequences
          - --config
          - --target
          - --gpus
          - --shards-per-gpu
          - --batch-size
          - --work-root
          - --out
      when: nanobody_producer_activate | bool

    - name: Verify the producer accepts every argument it is deployed with
      ansible.builtin.include_tasks: tasks/verify_entrypoint.yml
      vars:
        entrypoint_name: live-producer
        entrypoint_argv: "{{ nanobody_producer_launcher }}"
        entrypoint_flags: "{{ nanobody_producer_arguments | select('match', '^--') | list }}"
        entrypoint_environment:
          PIXI_COLOR: never
      when: nanobody_producer_activate | bool

    - name: Stop prior autonomous nanobody producer before activation
      ansible.builtin.command:
        argv: [tmux, kill-session, -t, "{{ nanobody_producer_session }}"]
      register: producer_stop
      changed_when: producer_stop.rc == 0
      failed_when: false
      when: nanobody_producer_activate | bool

    - name: Start autonomous Pixi nanobody producer
      ansible.builtin.command:
        argv: >-
          {{ ['tmux', 'new-session', '-d', '-s', nanobody_producer_session]
             + nanobody_producer_launcher + nanobody_producer_arguments }}
      changed_when: true
      when: nanobody_producer_activate | bool

    - name: Confirm autonomous nanobody producer remains alive
      ansible.builtin.command:
        argv: [tmux, has-session, -t, "{{ nanobody_producer_session }}"]
      changed_when: false
      when: nanobody_producer_activate | bool

    - name: Record successfully validated deployment revision
      ansible.builtin.copy:
        content: "{{ controller_revision.stdout }}\n"
        dest: /root/artifacts/nanobody_deployed_commit.txt
        owner: root
        group: root
        mode: "0644"

    - name: Report successful provisioning
      ansible.builtin.debug:
        msg: >-
          {{ bgen_check.stdout }}; {{ layer2_artifacts.stdout }};
          {{ layer2_canary.stdout_lines[-1] }}; archive and checkpoints ready;
          fast scorer pinned {{ nanobody_fast_scorer_sha256[:12] }};
          autonomous producer active={{ nanobody_producer_activate | bool }}
