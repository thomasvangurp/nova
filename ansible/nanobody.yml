---
# Nanobody toolchain. SEPARATE from the miner playbook because boltzgen requires
# torch==2.7.1 while the miner's bz2 env is pinned to 2.6.0 for boltz -- installing
# them together would break the live scorer.
#
#   ansible-playbook -i '<ip>,' ansible/nanobody.yml -e ansible_port=<port> --private-key <key>
- name: Provision the nanobody design/scoring box
  hosts: all
  remote_user: root
  gather_facts: false
  vars:
    target: P20809                 # IL-11; must match upstream config nanobody target
    structure: 6O4O
    bgen: /root/mamba/envs/bgen
    # SHA256 from the HuggingFace LFS manifest
    #   https://huggingface.co/api/models/boltzgen/boltzgen-1/tree/main
    # A size check is not enough: it catches truncation but not corruption, and
    # a corrupt checkpoint is invisible until inference. Note ifold is genuinely
    # ~12 MB while the others are ~1.9 GB -- that is correct, not a short read,
    # which is precisely why the threshold-on-size approach was misleading.
    ckpts:
      - name: boltzgen1_diverse.ckpt
        sha256: 360af8bd6e59527ff6ec25dd81253967f3bd3567d200053b10680634751f8e3c
      - name: boltzgen1_adherence.ckpt
        sha256: ac7078b3dc13064c68e0c3fd542e5bc538c33558bf6607f65e499eb336ca5e5d
      - name: boltzgen1_ifold.ckpt        # inverse folding -- our generator
        sha256: dd4cf108c94471bdc3a326b7b180fa3854dc019110fae780208c30b50bd56578
      - name: boltz2_conf_final.ckpt
        sha256: 525a51ef306da7282a54d23a4a5b91212fc60d0ff6b23b56dd6351de3b387530

  tasks:
    - name: Effective CPUs (cgroup v2 then v1)
      ansible.builtin.shell: |
        if [ -f /sys/fs/cgroup/cpu.max ]; then
          read q p < /sys/fs/cgroup/cpu.max
          [ "$q" = max ] && nproc || echo $(( q / p ))
        else
          q=$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us); p=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)
          [ "$q" -le 0 ] && nproc || echo $(( q / p ))
        fi
      changed_when: false
      register: cpus

    - name: Bandwidth probe (a host advertising 872 Mbps once delivered 57 KB/s)
      ansible.builtin.shell: |
        s=$(date +%s)
        curl -s -o /dev/null --max-time 60 https://huggingface.co/datasets/Metanova/Submission-Archive/resolve/main/{{ target }}_nanobodies.csv
        echo $(( $(date +%s) - s ))
      changed_when: false
      register: probe

    - ansible.builtin.assert:
        that: probe.stdout | int <= 30
        fail_msg: "8MB took {{ probe.stdout }}s -- destroy this host"
        success_msg: "{{ cpus.stdout }} CPUs, 8MB in {{ probe.stdout }}s"

    - name: micromamba present
      ansible.builtin.shell: |
        set -e
        mkdir -p /root/mamba/bin
        curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xvj -C /root/mamba bin/micromamba
      args: { creates: /root/mamba/bin/micromamba }

    # boltzgen needs torch 2.7.1; bz2 is pinned to 2.6.0. ISOLATED prefix.
    - name: Create the bgen env
      ansible.builtin.shell: |
        MAMBA_ROOT_PREFIX=/root/mamba /root/mamba/bin/micromamba create -y -p {{ bgen }} -c conda-forge python=3.11 pip
      args: { creates: "{{ bgen }}/bin/python" }

    # micromamba, NOT pip. pip assembles wheels built against different CUDA
    # minors and they only fail at runtime, deep inside a worker, as a segfault
    # or BrokenProcessPool with no traceback. conda-forge owns everything
    # CUDA-linked here; pip is used ONLY for what conda-forge cannot do (an
    # editable install of the vendored boltzgen source, below).
    - name: torch 2.7.1 + CUDA runtime (boltzgen pins the torch version)
      ansible.builtin.shell: |
        MAMBA_ROOT_PREFIX=/root/mamba /root/mamba/bin/micromamba install -y \
          -p {{ bgen }} -c conda-forge \
          "pytorch=2.7.1=cuda126*" pytorch-cuda cuda-version=12.6
      args: { creates: "{{ bgen }}/lib/python3.11/site-packages/torch/version.py" }

    - name: Assert torch actually sees the GPUs (a CPU-only build installs happily)
      ansible.builtin.command: >
        {{ bgen }}/bin/python -c
        "import torch;assert torch.cuda.is_available(), 'torch has no CUDA';
        print(torch.__version__, torch.cuda.device_count())"
      changed_when: false
      register: torchchk

    # rsync cannot create a nested destination when the parent is absent:
    # "mkdir /root/external_tools/boltzgen failed: No such file or directory".
    - name: Destination parents
      ansible.builtin.file: { path: "{{ item }}", state: directory }
      loop: [/root/external_tools, /root/nanobody_opt, /root/.boltzgen,
             /root/config, /root/bgen_shards,
             /root/data/structures, /root/data/msa_files]

    - name: Sync boltzgen source
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../external_tools/boltzgen/"
        dest: /root/external_tools/boltzgen/
        rsync_opts: ["--exclude=__pycache__", "--exclude=*.pyc"]

    - name: Install boltzgen (editable)
      ansible.builtin.shell: cd /root/external_tools/boltzgen && {{ bgen }}/bin/pip install -e .
      args: { creates: "{{ bgen }}/lib/python3.11/site-packages/boltzgen.egg-link" }

    - name: Verify boltzgen imports and sees the GPUs
      ansible.builtin.command: >
        {{ bgen }}/bin/python -c
        "import torch,boltzgen;assert torch.cuda.is_available();print(torch.__version__, torch.cuda.device_count())"
      changed_when: false
      register: bg
    - ansible.builtin.debug: { msg: "boltzgen OK: torch {{ bg.stdout }}" }

    # Serial, resumable, HTTP/1.1 -- concurrent downloads truncate each other and
    # HTTP/2 truncated a boltz checkpoint at 83% earlier today.
    # Serial, resumable, HTTP/1.1 -- concurrent downloads truncate each other and
    # HTTP/2 truncated a boltz checkpoint at 83% earlier. Verified by CHECKSUM,
    # and re-fetched from scratch if the hash is wrong: a resumed download that
    # appended onto a corrupt prefix would otherwise resume forever.
    - name: Download and checksum-verify boltzgen checkpoints
      ansible.builtin.shell: |
        set -u
        mkdir -p /root/.boltzgen && cd /root/.boltzgen
        f="{{ item.name }}"; want="{{ item.sha256 }}"
        for attempt in 1 2 3; do
          if [ -s "$f" ] && [ "$(sha256sum "$f" | cut -d" " -f1)" = "$want" ]; then
            echo "OK $f"; exit 0
          fi
          # a wrong hash means the bytes on disk are unusable -- never resume onto them
          [ -s "$f" ] && rm -f "$f"
          curl -L --http1.1 --retry 5 --retry-delay 5 \
               --speed-limit 100000 --speed-time 60 \
               -o "$f" "https://huggingface.co/boltzgen/boltzgen-1/resolve/main/$f" >/dev/null 2>&1
        done
        got=$(sha256sum "$f" 2>/dev/null | cut -d" " -f1)
        echo "MISMATCH $f want=$want got=${got:-<missing>}"; exit 1
      args: {executable: /bin/bash}
      loop: "{{ ckpts }}"
      loop_control: {label: "{{ item.name }}"}
      register: ck
      changed_when: "'OK' not in ck.stdout"

    - name: Nanobody archive for the target (basin + proxy training data)
      ansible.builtin.get_url:
        url: "https://huggingface.co/datasets/Metanova/Submission-Archive/resolve/main/{{ target }}_nanobodies.csv"
        dest: "/root/{{ target }}_nanobodies.csv"
        mode: "0644"

    # BoltzgenWrapper._create_yaml_content builds these paths itself:
    #   NOVA_DIR/data/structures/<nanobody_structure>.cif
    #   NOVA_DIR/data/msa_files/<target>.a3m
    # with NOVA_DIR=/root. Putting the CIF anywhere else means the YAML it
    # writes points at a file that does not exist, and boltzgen fails deep in
    # the run rather than at setup.
    - name: Target structure, at the path the wrapper builds
      ansible.builtin.get_url:
        url: "https://files.rcsb.org/download/{{ structure }}.cif"
        dest: "/root/data/structures/{{ structure }}.cif"
        mode: "0644"

    - name: MSA for the target (ships in the repo, not downloadable)
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../data/msa_files/{{ target }}.a3m"
        dest: "/root/data/msa_files/{{ target }}.a3m"

    - name: Assert the two files the wrapper hardcodes are present and non-empty
      ansible.builtin.stat: { path: "{{ item }}" }
      loop:
        - "/root/data/structures/{{ structure }}.cif"
        - "/root/data/msa_files/{{ target }}.a3m"
      register: wrapper_inputs

    - ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 1000
        fail_msg: "{{ item.item }} missing or truncated ({{ item.stat.size | default(0) }} bytes)"
        success_msg: "{{ item.item }} {{ item.stat.size }} bytes"
      loop: "{{ wrapper_inputs.results }}"
      loop_control: { label: "{{ item.item }}" }

    # BoltzgenWrapper resolves NOVA_DIR from its own __file__ (up four levels
    # from boltzgen/src/boltzgen) = /root, then reads /root/config/
    # boltzgen_config.yaml at a FIXED path in __init__. Passing a config path as
    # an argument does nothing. These two files define the scoring protocol --
    # metrics, rank mode, step/noise scales -- so they are fetched from upstream
    # rather than hand-written, and refetched every run so a protocol change
    # upstream cannot leave us scoring against a stale definition.
    - name: Upstream configs at the paths BoltzgenWrapper hardcodes
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/metanova-labs/nova/main/config/{{ item }}"
        dest: "/root/config/{{ item }}"
        mode: "0644"
        force: true
      loop:
        - boltzgen_config.yaml
        - config.yaml

    - name: Assert the scoring protocol is the one we think it is
      ansible.builtin.shell: |
        /root/bgen_python.sh -c "
        import yaml
        c=yaml.safe_load(open('/root/config/boltzgen_config.yaml'))
        m=[k for d in c['metrics'].values() for k in d]
        assert len(m)==10, f'expected 10 ranked metrics, got {len(m)}: {m}'
        assert c['protocol']=='nanobody-anything', c['protocol']
        print('PROTOCOL_OK', c['protocol'], len(m), 'metrics')
        "
      args: { executable: /bin/bash }
      changed_when: false
      register: proto

    - ansible.builtin.assert:
        that: "'PROTOCOL_OK' in proto.stdout"
        fail_msg: "boltzgen scoring protocol changed upstream:\n{{ proto.stdout }}{{ proto.stderr }}"
        success_msg: "{{ proto.stdout }}"

    # owner/group false is LOAD-BEARING. rsync -a preserves the CONTROLLER's
    # uid/gid, so a laptop checkout (uid 502) stamps 502:staff onto what it
    # writes. When that lands on /root itself, sshd StrictModes then refuses
    # every NEW public-key auth while existing multiplexed sessions keep
    # working -- it reads as a flaky proxy and is actually a lockout.
    - name: Sync nanobody_opt code
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../nanobody_opt/"
        dest: /root/nanobody_opt/
        owner: false
        group: false
        rsync_opts: ["--exclude=__pycache__", "--exclude=*.pyc", "--no-perms"]

    - name: Repair any controller-stamped ownership under /root
      ansible.builtin.shell: |
        set -eu
        bad=$(find /root -maxdepth 2 ! -user root -printf '%p\n' 2>/dev/null | head -20)
        if [ -n "$bad" ]; then echo "REPAIRED:"; echo "$bad"; chown -R root:root /root; fi
        chmod 700 /root
        stat -c '%U:%G %a /root' /root
      args: { executable: /bin/bash }
      changed_when: "'REPAIRED' in repair.stdout"
      register: repair

    - ansible.builtin.assert:
        that: "'root:root 700 /root' in repair.stdout"
        fail_msg: "/root ownership/mode wrong -- sshd StrictModes will refuse new key auth"
        success_msg: "/root ownership correct"

    - name: Proxy + scorer deps (conda-forge owns these, not pip)
      ansible.builtin.shell: |
        MAMBA_ROOT_PREFIX=/root/mamba /root/mamba/bin/micromamba install -y \
          -p {{ bgen }} -c conda-forge scikit-learn pandas requests
      args: { creates: "{{ bgen }}/lib/python3.11/site-packages/sklearn" }

    # ---- boltzgen as an EXACT SCORER ---------------------------------------
    # boltzgen_wrapper.py imports `bittensor` (logging only) and two symbols
    # from nova's `utils`. Nova's utils/__init__ eagerly pulls in metanano (the
    # whole NOVA-nanobody-filter service), datasets and combinatorial_db -- none
    # of it reachable from the functions actually used. bgen_shim supplies just
    # those two, so this box stays a scorer rather than half a validator.
    - name: Install the boltzgen scoring shim and interpreter wrapper
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/files/root/"
        dest: /root/
        checksum: true
        owner: false
        group: false
        rsync_opts: ["--exclude=__pycache__", "--exclude=*.pyc", "--no-perms"]

    - name: Restore the exec bit on the wrapper
      ansible.builtin.file: { path: /root/bgen_python.sh, mode: "0755" }

    # Prove the scorer is callable. An import that fails here is a deploy
    # failure; discovering it mid-scoring wastes the GPU hours instead.
    - name: Prove BoltzgenWrapper imports and sees the GPUs
      ansible.builtin.command: >
        /root/bgen_python.sh -c
        "import torch;
        from boltzgen.boltzgen_wrapper import BoltzgenWrapper;
        assert torch.cuda.is_available();
        print('BOLTZGEN_SCORER_OK', torch.cuda.device_count(), 'GPUs')"
      changed_when: false
      register: scorer

    - ansible.builtin.assert:
        that: "'BOLTZGEN_SCORER_OK' in scorer.stdout"
        fail_msg: "boltzgen scorer not callable:\n{{ scorer.stderr }}"
        success_msg: "{{ scorer.stdout }}"

    - name: Smoke-test the proxy on the archive
      ansible.builtin.command: >
        {{ bgen }}/bin/python -c
        "import pandas as pd;d=pd.read_csv('/root/{{ target }}_nanobodies.csv');print(len(d),'sequences',len(d.columns),'columns')"
      changed_when: false
      register: smoke
    - ansible.builtin.debug: { msg: "archive: {{ smoke.stdout }}" }
