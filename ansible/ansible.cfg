[defaults]
host_key_checking = False
interpreter_python = /usr/bin/python3
stdout_callback = default
display_skipped_hosts = False
callbacks_enabled = ansible.posix.profile_tasks
timeout = 60
retry_files_enabled = False

[ssh_connection]
pipelining = True
transfer_method = piped
ssh_args = -C -o ControlMaster=auto -o ControlPersist=300s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=20
