name: Deploy tested nanobody release

on:
  workflow_dispatch:
    inputs:
      host:
        description: SSH host of the target producer
        required: true
        type: string
      port:
        description: SSH port
        required: true
        default: '22'
        type: string
      activate:
        description: Activate the producer after release verification
        required: true
        default: false
        type: boolean
      promotion_run_id:
        description: Successful same-revision Actions run containing sn68-promotion-evidence (required for activation)
        required: false
        type: string
      target:
        description: Exact live target covered by promotion evidence (required for activation)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sn68-deploy-${{ inputs.host }}-${{ inputs.port }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sn68-tested-release
          path: ${{ runner.temp }}/sn68-tested-release
      - name: Install Ansible
        run: |
          python -m pip install 'ansible-core>=2.16,<2.22'
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Verify evidence run belongs to this tested revision
        if: inputs.activate
        uses: actions/github-script@v7
        env:
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
        with:
          script: |
            const id = process.env.PROMOTION_RUN_ID;
            if (!/^[0-9]+$/.test(id || '')) throw new Error('Promotion evidence run is required');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: Number(id)});
            if (run.head_sha !== context.sha || run.conclusion !== 'success' ||
                run.path !== '.github/workflows/qualify-nanobody-release.yml' ||
                run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Evidence run must have passed for this exact repository and revision');
            }
      - name: Download promotion evidence
        if: inputs.activate
        uses: actions/download-artifact@v4
        with:
          name: sn68-promotion-evidence
          path: ${{ runner.temp }}/sn68-promotion-evidence
          run-id: ${{ inputs.promotion_run_id }}
          github-token: ${{ github.token }}
      - name: Deploy the tested release
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SN68_DEPLOY_HOST: ${{ inputs.host }}
          SN68_DEPLOY_PORT: ${{ inputs.port }}
          SN68_DEPLOY_ACTIVATE: ${{ inputs.activate }}
          SN68_TESTED_SHA: ${{ github.sha }}
          SN68_RELEASE_DIR: ${{ runner.temp }}/sn68-tested-release
          SN68_PROMOTION_DIR: ${{ runner.temp }}/sn68-promotion-evidence
          SN68_TARGET: ${{ inputs.target }}
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: python scripts/deploy_tested_release.py
